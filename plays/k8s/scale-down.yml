---
- hosts: localhost
  gather_facts: false
  tasks:
    - name: Initialize the list of namespaces that failed to scale down
      ansible.builtin.set_fact:
        k8s_scale_failed_namespaces: []

    - ansible.builtin.include_tasks: tasks/scale-one-namespace.yml
      vars:
        k8s_scale_target_direction: down
      loop: "{{ k8s_scale_down_order }}"
      loop_control:
        loop_var: k8s_scale_target_namespace

    - name: Fail if any namespace failed to scale down
      ansible.builtin.fail:
        msg: >-
          The following namespaces failed to scale down:
          {{ k8s_scale_failed_namespaces | join(", ") }}
      when: k8s_scale_failed_namespaces | length > 0
