---
- name: Play to setup choros.tswn.us
  become: true
  hosts: choros.tswn.us
  handlers:
    # Note: these run in the order they are defined in (regardless of invocation order)!
    - name: systemctl daemon-reload
      ansible.builtin.systemd_service:
        daemon_reload: true
    - name: bootc-fetch-apply-updates.timer
      ansible.builtin.systemd_service:
        name: bootc-fetch-apply-updates.timer
        state: restarted
    - name: firewalld.service
      ansible.builtin.systemd_service:
        name: firewalld.service
        state: restarted
    - name: systemd-journald.service
      ansible.builtin.systemd_service:
        name: systemd-journald.service
        state: restarted
    - name: systemd-modules-load.service
      ansible.builtin.systemd_service:
        name: systemd-modules-load.service
        state: restarted
    - name: systemd-sysctl.service
      ansible.builtin.systemd_service:
        name: systemd-sysctl.service
        state: restarted
    # podman network create runs with --ignore, so a changed network applies
    # only after the old one is gone.  Stop the pod, which uses it, and let
    # NetworkDeleteOnStop remove it.  The next handler starts the pod again.
    - name: Stop hogs-pod for a network change
      ansible.builtin.systemd_service:
        name: hogs-pod.service
        state: stopped
      listen:
        - hogs-services-network.service
    - name: hogs-services-network.service
      ansible.builtin.systemd_service:
        name: hogs-services-network.service
        state: restarted
    - name: hogs-pod.service
      ansible.builtin.systemd_service:
        name: hogs-pod.service
        state: restarted
      listen:
        - alloy.service
        - hfp-wireguard.service
        - hogs-pod.service
        - hogs-services-network.service
        - kv-wireguard.service
        - wireguard.service
  roles:
    - role: common-users
    - role: devsec.hardening.ssh_hardening
      vars:
        ssh_kerberos_supprt: false
  tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
    
    # Only bootc applies updates, at 03:00 Pacific.
    - name: Disable rpm-ostree auto-update
      ansible.builtin.systemd_service:
        enabled: false
        name: rpm-ostreed-automatic.timer
        state: stopped
    - name: Ensure the bootc update timer drop-in directory exists
      ansible.builtin.file:
        group: root
        mode: u=rwx,g=rx,o=rx
        owner: root
        path: /etc/systemd/system/bootc-fetch-apply-updates.timer.d
        state: directory
    - name: Schedule bootc auto-update
      ansible.builtin.copy:
        content: |
          [Timer]
          # Clear the stock triggers.  The update then runs at 03:00 only.
          OnBootSec=
          OnUnitInactiveSec=
          OnCalendar=*-*-* 03:00:00 America/Los_Angeles
          RandomizedDelaySec=0
        dest: /etc/systemd/system/bootc-fetch-apply-updates.timer.d/schedule.conf
        group: root
        mode: u=rw,g=r,o=r
        owner: root
      notify:
        - systemctl daemon-reload
        - bootc-fetch-apply-updates.timer
    - name: Enable bootc auto-update
      ansible.builtin.systemd_service:
        enabled: true
        name: bootc-fetch-apply-updates.timer
        state: started

    # Firewalld Setup
    - name: Setup firewalld.conf
      ansible.builtin.copy:
        content: |
          LogDenied=unicast
        dest: /etc/firewalld/firewalld.conf
        mode: u=rw,g=r,o=r
        owner: root
        group: root
      notify:
        - firewalld.service
      tags:
        - firewall
    
    # HOGS Pod & Network Setup
    - name: Setup HOGS services container network
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=A network with a known set of addresses to talk to HOGS services.

          [Network]
          DisableDNS=true
          Gateway=10.11.2.1
          IPRange=10.11.2.128/25
          IPv6=false
          NetworkDeleteOnStop=true
          Subnet=10.11.2.0/24
        dest: /etc/containers/systemd/hogs-services.network
        mode: u=rw,g=r,o=r
        owner: root
        group: root
      notify:
        - systemctl daemon-reload
        - hogs-services-network.service
      tags:
        - hogs-pod
    - name: Setup HOGS pod for containers
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=A pod that contains a set of containers that need to talk to HOGS.

          [Pod]
          DNS=10.11.1.66
          Network=hogs-services.network
          # A fixed address keeps UDP conntrack entries valid across restarts.
          IP=10.11.2.129
          # 7 Days to Die (Relic)
          PublishPort={{ ansible_facts['default_ipv4'].address }}:26900:26900/tcp
          PublishPort={{ ansible_facts['default_ipv4'].address }}:26900:26900/udp
          PublishPort={{ ansible_facts['default_ipv4'].address }}:26901:26901/udp
          PublishPort={{ ansible_facts['default_ipv4'].address }}:26902:26902/udp
          # code-ssh.tswn.us SSH Forwarding
          PublishPort={{ ansible_facts['default_ipv4'].address }}:2222:2222/tcp
          # Factorio
          PublishPort={{ ansible_facts['default_ipv4'].address }}:34197:34197/udp
          # HFP
          PublishPort={{ ansible_facts['default_ipv4'].address }}:51823:51823/udp
          # Traefik Proxy
          PublishPort={{ ansible_facts['default_ipv4'].address }}:443:443/tcp
          # Unifi INFORM
          PublishPort={{ ansible_facts['default_ipv4'].address }}:8080:8080/tcp
          PublishPort={{ ansible_facts['default_ipv4'].address }}:3478:3478/udp
          # Valheim Relic
          PublishPort={{ ansible_facts['default_ipv4'].address }}:2456:2456/udp
          PublishPort={{ ansible_facts['default_ipv4'].address }}:2457:2457/udp
          # Wireguard
          PublishPort={{ ansible_facts['default_ipv4'].address }}:51821:51821/udp
          PublishPort={{ ansible_facts['default_ipv4'].address }}:51822:51822/udp

          [Install]
          WantedBy=multi-user.target default.target
        dest: /etc/containers/systemd/hogs.pod
        mode: u=rw,g=r,o=r
        owner: root
        group: root
      notify:
        - systemctl daemon-reload
        - hogs-pod.service
      tags:
        - hogs-pod

    # Node Monitoring
    - name: Ensure directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: u=rw,g=r,o=r
        owner: root
        group: root
      loop:
        - /etc/containers/systemd/alloy.container.d
        - /etc/systemd/journald.conf.d
      tags:
        - alloy
        - hogs-pod
    - name: Modify Alloy container to run as part of HOGS pod
      ansible.builtin.copy:
        content: |
          [Container]
          Pod=hogs.pod
          Volume=/etc/alloy/loki.alloy:/etc/alloy/loki.alloy:ro
        dest: /etc/containers/systemd/alloy.container.d/override.conf
        mode: u=rw,g=r,o=r
        owner: root
        group: root
      notify:
        - alloy.service
        - systemctl daemon-reload
      tags:
        - alloy
        - hogs-pod
    - name: Configure Loki target
      ansible.builtin.copy:
        content: |
          loki.write "default" {
            endpoint {
              url = "http://10.11.1.72:3100/loki/api/v1/push"
            }
          }
        dest: /etc/alloy/loki.alloy
        mode: u=rw,g=r,o=r
        owner: root
        group: root
      notify:
        - alloy.service
      tags:
        - alloy
        - hogs-pod
    - name: Install journald.conf for Alloy
      ansible.builtin.copy:
        content: |
          [Journal]
          # Alloy pod will read from journalctl.
          ForwardToSyslog=no

          # Alloy should be ingesting this, but keep a bit extra just in case!
          MaxRetentionSec=7day
        dest: /etc/systemd/journald.conf.d/alloy.conf
        mode: u=rw,g=r,o=r
        owner: root
        group: root
      notify:
        - systemd-journald.service
      tags:
        - alloy

    # Wireguard Forwarding
    - name: Setup sysctl's for router functionality
      ansible.builtin.copy:
        content: |
          net.ipv4.conf.all.forwarding = 1
          net.ipv4.ip_unprivileged_port_start = 0
        dest: /etc/sysctl.d/90-router.conf
        mode: u=rw,g=r,o=r
        owner: root
        group: root
      notify:
        - systemd-sysctl.service
      tags:
        - sysctl
    - name: Setup loading of additional kernel modules needed by Wireguard
      ansible.builtin.copy:
        content: |
          wireguard
          # iptables/nftables modules for basic DNAT/SNAT and masquerading
          nft_chain_nat
          nft_compat
          xt_nat
          # nftables modules for wg-quick default route
          nft_ct
          nft_fib_ine
        dest: /etc/modules-load.d/wireguard.conf
        mode: u=rw,g=r,o=r
        owner: root
        group: root
      notify:
        - systemd-modules-load.service
      tags:
        - modules-load
    - name: Ensure /etc/wireguard exists
      ansible.builtin.file:
        group: root
        mode: u=rwx,g=,o=
        owner: root
        path: /etc/wireguard
        state: directory
      tags:
        - hfp-wireguard
        - hogs-pod
        - kv-wireguard
        - wireguard
    - name: Setup Wireguard Config
      ansible.builtin.copy:
        content: |
          [Interface]
          Address = 10.11.2.2/32
          ListenPort = 51821
          MTU = 1280
          PrivateKey = {{ wireguard__privkey }}

          # 7 Days to Die (Relic) Forwarding
          PreUp = iptables --table nat --append PREROUTING --protocol tcp --dport 26900 --jump DNAT --to-destination 10.11.1.74:26900
          PreUp = iptables --table nat --append POSTROUTING --protocol tcp --destination 10.11.1.74 --dport 26900 --jump MASQUERADE
          PreUp = iptables --table nat --append PREROUTING --protocol udp --dport 26900 --jump DNAT --to-destination 10.11.1.74:26900
          PreUp = iptables --table nat --append POSTROUTING --protocol udp --destination 10.11.1.74 --dport 26900 --jump MASQUERADE
          PreUp = iptables --table nat --append PREROUTING --protocol udp --dport 26901 --jump DNAT --to-destination 10.11.1.74:26901
          PreUp = iptables --table nat --append POSTROUTING --protocol udp --destination 10.11.1.74 --dport 26901 --jump MASQUERADE
          PreUp = iptables --table nat --append PREROUTING --protocol udp --dport 26902 --jump DNAT --to-destination 10.11.1.74:26902
          PreUp = iptables --table nat --append POSTROUTING --protocol udp --destination 10.11.1.74 --dport 26902 --jump MASQUERADE

          # code-ssh.tswn.us SSH Forwarding
          PreUp = iptables --table nat --append PREROUTING --protocol tcp --dport 2222 --jump DNAT --to-destination 10.11.1.70:2222
          PreUp = iptables --table nat --append POSTROUTING --protocol tcp --destination 10.11.1.70 --dport 2222 --jump MASQUERADE

          # Factorio Forwarding
          PreUp = iptables --table nat --append PREROUTING --protocol udp --dport 34197 --jump DNAT --to-destination 10.11.1.69:34197
          PreUp = iptables --table nat --append POSTROUTING --protocol udp --destination 10.11.1.69 --dport 34197 --jump MASQUERADE

          # Traefik Port Forwarding.  Forward only connections from Cloudflare,
          # over kv0 with no masquerade, so Traefik sees the Cloudflare address.
          {% for cidr in cloudflare_ips_v4 %}
          PreUp = iptables --table nat --append PREROUTING --protocol tcp --source {{ cidr }} --dport 443 --jump DNAT --to-destination 10.11.3.64:8443
          {% endfor %}

          # Unifi Inform Forwarding
          PreUp = iptables --table nat --append PREROUTING --protocol tcp --dport 8080 --jump DNAT --to-destination 10.11.1.65:8080
          PreUp = iptables --table nat --append PREROUTING --protocol udp --dport 3478 --jump DNAT --to-destination 10.11.1.65:3478
          PreUp = iptables --table nat --append POSTROUTING --protocol tcp --destination 10.11.1.65 --dport 8080 --jump MASQUERADE
          PreUp = iptables --table nat --append POSTROUTING --protocol udp --destination 10.11.1.65 --dport 3478 --jump MASQUERADE

          # Valheim Relic Forwarding
          PreUp = iptables --table nat --append PREROUTING --protocol udp --dport 2456 --jump DNAT --to-destination 10.11.1.68:2456
          PreUp = iptables --table nat --append POSTROUTING --protocol udp --destination 10.11.1.68 --dport 2456 --jump MASQUERADE
          PreUp = iptables --table nat --append PREROUTING --protocol udp --dport 2457 --jump DNAT --to-destination 10.11.1.68:2457
          PreUp = iptables --table nat --append POSTROUTING --protocol udp --destination 10.11.1.68 --dport 2457 --jump MASQUERADE

          [Peer]
          PersistentKeepalive = 25
          PublicKey = EUDwE7E1dmbiJZXBSH0txxs/3B+eACWdfDocMvi5Fno=
          AllowedIPs = {{ allowed_ips | join(', ') }}
        dest: /etc/wireguard/hogs0.conf
        mode: u=rw,g=r
        owner: root
        group: root
      no_log: true # Contains the wireguard private key!
      notify:
        - wireguard.service
      tags:
        - hogs-pod
        - wireguard
      vars:
        allowed_ips:
          - 10.11.2.1/32 # Gateway
          - 10.11.1.1/32 # Jellyfin
          - 10.11.1.64/32 # Traefik
          - 10.11.1.65/32 # Unifi Controller
          - 10.11.1.66/32 # DNS Server
          - 10.11.1.68/32 # Valheim Relic
          - 10.11.1.69/32 # Factorio
          - 10.11.1.70/32 # code.tswn.us SSH Server
          - 10.11.1.72/32 # loki-distributor
          - 10.11.1.74/32 # 7 Days to Die (Relic)
        wireguard__privkey: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          65363935346361653034666130656437303839336239663564346538333164353732643934373833
          3335373164356164383932666237343563653733643238300a313231616633313130343732373834
          30626165306338323162613264643562623163633334333339366339336662333635393838366564
          3534623832613566300a386266623766386135393636353435353966383463303430653739376562
          37363132376437626438383166376338383339356239636563386638616339333466393962386235
          3361663561313533386664633930326432333730343561306634
    - name: Setup Wireguard container
      ansible.builtin.copy:
        content: |
          [Unit]
          ConditionPathExists=/etc/wireguard/hogs0.conf
          Description=A container that hosts a wireguard VPN server and routes traffic through it.

          [Container]
          AddCapability=NET_ADMIN
          AddCapability=NET_RAW
          DropCapability=ALL
          HealthCmd=CMD-SHELL ping -c 1 10.11.1.1 || exit 1
          HealthInterval=30s
          HealthLogDestination=events_logger
          HealthRetries=3
          HealthStartPeriod=10s
          NoNewPrivileges=true
          Image=docker.io/procustodibus/wireguard
          Pod=hogs.pod
          Volume=/etc/wireguard/hogs0.conf:/etc/wireguard/wg0.conf:Z
        dest: /etc/containers/systemd/wireguard.container
        mode: u=rw,g=r,o=r
        owner: root
        group: root
      notify:
        - systemctl daemon-reload
        - wireguard.service
      tags:
        - hogs-pod
        - wireguard
      
    # HFP
    - name: Setup HFP Wireguard Config
      ansible.builtin.copy:
        content: |
          [Interface]
          Address = 10.11.2.30/32
          ListenPort = 51823
          MTU = 1280
          PrivateKey = {{ wireguard__privkey }}

          {% for hostname in groups['hogsflixplus'] %}
          [Peer]
          PublicKey = {{ hostvars[hostname].wireguard__pubkey }}
          AllowedIPs = {{ hostvars[hostname].wireguard__address | ansible.utils.ipaddr('address') }}/32
          {% endfor %}
        dest: /etc/wireguard/hfp0.conf
        mode: u=rw,g=r
        owner: root
        group: root
      no_log: true # Contains the wireguard private key!
      notify:
        - hfp-wireguard.service
      tags:
        - hogs-pod
        - hfp-wireguard
      vars:
        wireguard__privkey: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          62306262626166313039376234306564333664303061666639333162636566306263386133656130
          3162346632323933343062623136363365363035633131310a613339373135393965333831353430
          62346161346364383335346632363666396263633732346166393866363832303664376136353537
          3762373566633835340a393062626636303061633039336534306365663438613132343165343465
          66333430336439653565653834313739323430613835353330303638643430333630616339633666
          6565343133316431633366346238653862663836656232383463
    - name: Setup HFP Wireguard container
      ansible.builtin.copy:
        content: |
          [Unit]
          ConditionPathExists=/etc/wireguard/hfp0.conf
          Description=A container that hosts a wireguard VPN server and routes traffic through it for peers.

          [Container]
          AddCapability=NET_ADMIN
          AddCapability=NET_RAW
          DropCapability=ALL
          HealthCmd=CMD-SHELL ping -c 1 10.11.1.1 || exit 1
          HealthInterval=60s
          HealthLogDestination=events_logger
          HealthRetries=3
          HealthStartPeriod=10s
          NoNewPrivileges=true
          Image=docker.io/procustodibus/wireguard
          Pod=hogs.pod
          Volume=/etc/wireguard/hfp0.conf:/etc/wireguard/wg1.conf:Z
        dest: /etc/containers/systemd/hfp-wireguard.container
        mode: u=rw,g=r,o=r
        owner: root
        group: root
      notify:
        - systemctl daemon-reload
        - hfp-wireguard.service
      tags:
        - hogs-pod
        - hfp-wireguard

    - name: Setup kube-vip Wireguard Config
      ansible.builtin.copy:
        content: |
          [Interface]
          Address = 10.11.3.1/32
          ListenPort = 51822
          # kube-vip fixes its end of the tunnel at 1420.  Use the same value.
          MTU = 1420
          PrivateKey = {{ wireguard__privkey }}

          # kube-vip sends the ICMP "need to frag" message for these flows into
          # the tunnel, not to the pod.  Path MTU discovery fails, so clamp MSS.
          PreUp = iptables --table mangle --append FORWARD --out-interface kv0 --protocol tcp --tcp-flags SYN,RST SYN --jump TCPMSS --clamp-mss-to-pmtu
          PreUp = iptables --table mangle --append FORWARD --in-interface kv0 --protocol tcp --tcp-flags SYN,RST SYN --jump TCPMSS --set-mss 1380

          [Peer]
          AllowedIPs = 10.11.3.64/32
          PublicKey = XtA4c8MsSJn5yR+aeTFdQjLWZiwZ+m1DDWQ5/GRtbT4=
        dest: /etc/wireguard/kv0.conf
        mode: u=rw,g=r
        owner: root
        group: root
      no_log: true
      notify:
        - kv-wireguard.service
      tags:
        - hogs-pod
        - kv-wireguard
      vars:
        wireguard__privkey: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          31626662643563653335643230303239666331313533633566656332303437353935353730623764
          3534333334323666396264646266313636646138393835620a316536663435333364343562633436
          38306661356236626137623537323261663763326235663135393039336231643936326233326236
          3935383566333631390a326162626162613334313837633166306430356533313465613534363066
          34343065623762663635336265346233316639306662396235646139666634343762326335386432
          3330323830303431303063346235613032323731636139356266
    - name: Setup kube-vip Wireguard container
      ansible.builtin.copy:
        content: |
          [Unit]
          ConditionPathExists=/etc/wireguard/kv0.conf
          Description=A container that hosts the choros end of the wireguard tunnel to kube-vip.

          [Container]
          AddCapability=NET_ADMIN
          AddCapability=NET_RAW
          DropCapability=ALL
          HealthCmd=CMD-SHELL wg show kv0 || exit 1
          HealthInterval=60s
          HealthLogDestination=events_logger
          HealthRetries=3
          HealthStartPeriod=10s
          NoNewPrivileges=true
          Image=docker.io/procustodibus/wireguard
          Pod=hogs.pod
          Volume=/etc/wireguard/kv0.conf:/etc/wireguard/kv0.conf:Z
        dest: /etc/containers/systemd/kv-wireguard.container
        mode: u=rw,g=r,o=r
        owner: root
        group: root
      notify:
        - systemctl daemon-reload
        - kv-wireguard.service
      tags:
        - hogs-pod
        - kv-wireguard
