---
- hosts: kairos
  gather_facts: false
  order: sorted
  tasks:
    - name: Sanity Check localroot password hash
      ansible.builtin.assert:
        fail_msg: >-
          The localroot `password` in `common__unix_users` must hold a
          crypt hash, not a password.  Generate one with
          `mkpasswd --method=yescrypt`.
        that:
          - localroot.password is match('^\$[1-9a-z]+\$')
      delegate_to: localhost
      run_once: true
      vars:
        localroot: >-
          {{ common__unix_users | selectattr('name', 'equalto', 'localroot') | first }}
      when: common__unix_users | selectattr('name', 'equalto', 'localroot') | list | length > 0
      tags:
        - always
    - name: Ensure configuration is up-to-date
      ansible.builtin.template:
        dest: /oem/90_custom.yaml
        src: templates/config.yml.j2
        validate: kairos validate %s
      become: true
      register: config
      vars:
        controlplane_hosts: "{{ groups['kairos_controlplane'] }}"
        host: "{{ inventory_hostname }}"
    - name: Ensure k3s service file is up-to-date
      ansible.builtin.template:
        dest: /etc/systemd/system/k3s.service.d/override.conf
        src: templates/k3s.service.j2
      become: true
      register: k3s_service
      when: k3s_controlplane
    - name: Ensure k3s-agent service file is up-to-date
      ansible.builtin.template:
        dest: /etc/systemd/system/k3s-agent.service.d/override.conf
        src: templates/k3s-agent.service.j2
      become: true
      register: k3s_agent_service
      when: not k3s_controlplane
    # `kairos-agent` applies `grub_options` only at the first boot; see
    # `config.yml.j2`.  The tasks below write the same `extra_cmdline` GRUB
    # variable, so the arguments also apply to an installed node.  The tasks
    # run on all hosts.  On a host that does not set
    # `kairos__extra_cmdline`, the tasks remove the arguments that an
    # earlier run set.
    #
    # `grub2-editenv <file> list` creates the file when the file does not
    # exist.  For this reason, `Read the OEM GRUB environment` runs only
    # when the file exists.  Without that condition, a run with no change
    # writes to the OEM partition.
    - name: Check if the OEM GRUB environment file exists
      ansible.builtin.stat:
        path: /oem/grubenv
      become: true
      register: grubenv_file
    - name: Read the OEM GRUB environment
      ansible.builtin.command:
        argv:
          - grub2-editenv
          - /oem/grubenv
          - list
      become: true
      changed_when: false
      register: grubenv_current
      when: grubenv_file.stat.exists
    # `argv` keeps the full assignment as one command argument.  With `cmd`,
    # shlex splits the string on spaces.  A value with two kernel arguments
    # then becomes two command arguments, and `grub2-editenv` rejects the
    # command.
    #
    # A failure here stops the play for this host before the reboot
    # decision.  The host then has the new files on disk and the old
    # configuration in memory.
    - name: Set the extra kernel arguments
      ansible.builtin.command:
        argv:
          - grub2-editenv
          - /oem/grubenv
          - set
          - "extra_cmdline={{ kairos__extra_cmdline | join(' ') }}"
      become: true
      register: grubenv_set
      when:
        - kairos__extra_cmdline | default([]) | length > 0
        - "'extra_cmdline=' ~ (kairos__extra_cmdline | join(' ')) not in (grubenv_current.stdout_lines | default([]))"
    - name: Remove the extra kernel arguments
      ansible.builtin.command:
        argv:
          - grub2-editenv
          - /oem/grubenv
          - unset
          - extra_cmdline
      become: true
      register: grubenv_unset
      when:
        - kairos__extra_cmdline | default([]) | length == 0
        - grubenv_current.stdout | default('') is search('^extra_cmdline=', multiline=True)
    # The tasks above write files.  Only a boot applies them.  A run that
    # writes the files but stops before the reboot because the drain fails
    # gives no `changed` result on the next run.  That run skips the host.
    - name: Read the active kernel command line
      ansible.builtin.slurp:
        src: /proc/cmdline
      become: true
      register: proc_cmdline
    - name: Read the boot time
      ansible.builtin.slurp:
        src: /proc/stat
      become: true
      register: proc_stat
    - name: Read the times of the files that a boot applies
      ansible.builtin.stat:
        path: "{{ item }}"
      become: true
      loop:
        - /oem/90_custom.yaml
        - "/etc/systemd/system/{{ 'k3s' if k3s_controlplane else 'k3s-agent' }}.service.d/override.conf"
      register: boot_applied_files
    - name: Note if the host needs to be rebooted
      ansible.builtin.set_fact:
        reboot_required: >-
          {{ config.changed or k3s_service.changed or k3s_agent_service.changed
             or grubenv_set.changed or grubenv_unset.changed
             or (kairos__extra_cmdline | default([])
                 | difference((proc_cmdline.content | b64decode).split())
                 | length > 0)
             or (boot_time | int > 0
                 and newest_file_time | int > boot_time | int + 300) }}
      vars:
        boot_time: >-
          {{ proc_stat.content | b64decode
             | regex_search('^btime (\d+)$', '\1', multiline=True)
             | default(['0'], true) | first }}
        newest_file_time: >-
          {{ boot_applied_files.results | selectattr('stat.exists')
             | map(attribute='stat.mtime') | max | default(0) }}
    - name: Schedule Drain and Reboot
      ansible.builtin.add_host:
        name: "{{ item }}"
        group: ToReboot
      changed_when: false
      delegate_to: localhost
      loop: "{{ ansible_play_batch }}"
      when: hostvars[item].reboot_required

- name: Serially drain and reboot hosts that need to be rebooted
  hosts: ToReboot
  gather_facts: false
  order: sorted
  # A larger batch can reboot two nodes that hold single-replica
  # Longhorn volumes at the same time.
  serial: 1
  strategy: free
  tasks:
    # `kubectl drain` does not have a default timeout.  The
    # PodDisruptionBudget of a Longhorn instance-manager can report zero
    # permitted disruptions until Longhorn stops the replicas on the node.
    # Without `--timeout`, `kubectl drain` does not return, and the node
    # stays cordoned.
    #
    # With `--timeout`, `kubectl drain` exits with an error, and the
    # `always` section uncordons the node.  Without the `always` section,
    # the play stops and the node stays cordoned and empty until an operator
    # uncordons it.  The play stops because `serial: 1` makes one failed
    # host a failed batch.
    - name: Drain, reboot, and uncordon the host
      block:
        - name: Drain
          ansible.builtin.shell:
            cmd: "kubectl drain {{ inventory_hostname_short }} --ignore-daemonsets --delete-emptydir-data --force --timeout=600s --pod-selector='{{ pod_selectors | join(',') }}' --kubeconfig ~/.kube/config"
          delegate_to: localhost
          vars:
            pod_selectors: []
        # The boot writes every file in this directory again, so a file that
        # the configuration no longer holds stays on disk until a task removes
        # it.  The removal comes here, between the drain and the reboot,
        # because only the next boot writes the files again.
        - name: Collect all network configuration files
          ansible.builtin.find:
            file_type: any
            hidden: true
            paths: /etc/systemd/network/
          become: true
          failed_when: collected_network_files.skipped_paths | default({}) | length > 0
          register: collected_network_files
        - name: Remove all collected network files
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: absent
          become: true
          loop: "{{ collected_network_files.files }}"
          loop_control:
            label: "{{ item.path }}"
        - name: Reboot
          ansible.builtin.reboot:
            pre_reboot_delay: 60 # seconds
            connect_timeout: 240 # seconds
            test_command: "{{ reboot_test_command }}"
          become: true
        # GRUB finds the environment block with a search for a file named
        # `grubenv` on all partitions.  Another partition with that file can
        # make GRUB read the wrong one.  The arguments are then absent, and
        # the play gives no other sign.  Do not test
        # `/sys/module/ttm/parameters/pages_limit`: that value is writable
        # at run time, so it can hold the new number while the kernel
        # command line does not.
        - name: Verify the kernel command line has the extra arguments
          ansible.builtin.slurp:
            src: /proc/cmdline
          become: true
          register: proc_cmdline_after
          failed_when: >-
            kairos__extra_cmdline
            | difference((proc_cmdline_after.content | b64decode).split())
            | length > 0
          when: kairos__extra_cmdline | default([]) | length > 0
      always:
        - name: Uncordon
          kubernetes.core.k8s_drain:
            name: "{{ inventory_hostname_short }}"
            state: uncordon
          delegate_to: localhost
          retries: 3
          delay: 10
