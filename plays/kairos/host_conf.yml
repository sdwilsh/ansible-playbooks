---
- hosts: localhost
  gather_facts: false
  vars_prompt:
    - name: host
      prompt: What is the innventory hostname to generate a host configuration for?
      private: false
  tasks:
    - name: Sanity Check
      ansible.builtin.assert:
        fail_msg: "Specified host '{{ host }}' does not meet the requirements."
        that:
          - host in hostvars
          - "'k3s_token' in hostvars[host]"
      tags:
        - always
    - name: Sanity Check network interfaces
      ansible.builtin.assert:
        fail_msg: >-
          Host '{{ host }}' has no real MAC address or interface name set.
          Confirm the real hardware facts first.
        that:
          - hostvars[host].common__interfaces.bonds is defined or
            ((hostvars[host].common__interfaces.interfaces | first).mac
            | ansible.utils.macaddr) is not none
          - hostvars[host].common__interfaces.bonds is defined or
            (hostvars[host].common__interfaces.interfaces | first).name != 'TODO'
      tags:
        - always
    - name: Create temporary directory to host configuration from
      ansible.builtin.tempfile:
        state: directory
      register: workdir
    - name: Generate configuration
      ansible.builtin.template:
        dest: "{{ workdir.path }}/config.yml"
        src: templates/config.yml.j2
      vars:
        controlplane_hosts: "{{ groups['kairos_controlplane'] }}"
    - name: Host configuration on port 9000
      ansible.builtin.command:
        chdir: "{{ workdir.path }}"
        cmd: python3 -m http.server 9000
