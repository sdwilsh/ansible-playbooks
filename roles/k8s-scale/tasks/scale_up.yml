---
- ansible.builtin.include_tasks: discover.yml

# Each `cnpg` `Cluster` resumes independently.  `wait: false` starts every
# resume without waiting.  The next task waits for all of them at once.
- name: "Resume cnpg Clusters in {{ k8s_scale_namespace }}"
  kubernetes.core.k8s:
    context: "{{ k8s_scale_context }}"
    state: patched
    resource_definition:
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: "{{ item.metadata.name }}"
        namespace: "{{ item.metadata.namespace }}"
        annotations:
          cnpg.io/hibernation: "off"
    wait: false
  loop: "{{ k8s_scale_cnpg_clusters }}"
  loop_control:
    label: "Cluster/{{ item.metadata.name }}"

- name: "Wait for {{ item.metadata.name }} cnpg Cluster to become ready in {{ k8s_scale_namespace }}"
  kubernetes.core.k8s_info:
    context: "{{ k8s_scale_context }}"
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace }}"
  register: k8s_scale_up_cnpg_status
  until: >-
    (k8s_scale_up_cnpg_status.resources
     | selectattr('status.conditions', 'defined')
     | map(attribute='status.conditions')
     | flatten(levels=1)
     | selectattr('type', 'equalto', 'Ready')
     | selectattr('status', 'equalto', 'True')
     | selectattr('reason', 'equalto', 'ClusterIsReady')
     | list | length) > 0
  retries: "{{ ((k8s_scale_cnpg_timeout / k8s_scale_poll_interval) | round(0, 'ceil') | int) + 1 }}"
  delay: "{{ k8s_scale_poll_interval }}"
  loop: "{{ k8s_scale_cnpg_clusters }}"
  loop_control:
    label: "Cluster/{{ item.metadata.name }}"

# Each restore is also independent.  `wait: false` starts every restore
# without waiting.  A workload with no recorded replica count is skipped
# here.  A later task checks for that case.
- name: "Restore Deployments/StatefulSets with a recorded replica count in {{ k8s_scale_namespace }}"
  kubernetes.core.k8s:
    context: "{{ k8s_scale_context }}"
    state: patched
    resource_definition:
      apiVersion: "{{ item.apiVersion }}"
      kind: "{{ item.kind }}"
      metadata:
        name: "{{ item.metadata.name }}"
        namespace: "{{ item.metadata.namespace }}"
        annotations: "{{ k8s_scale_clear_annotation }}"
      spec:
        replicas: "{{ (item.metadata.annotations | default({}))[k8s_scale_replicas_annotation] | int }}"
    wait: false
  vars:
    # Ansible does not template a dict key written directly in YAML.  Build
    # the dict as a `vars:` value instead, as in `tasks/argocd_sync_policy.yml`.
    k8s_scale_clear_annotation: "{{ {k8s_scale_replicas_annotation: None} }}"
  loop: "{{ k8s_scale_workloads }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  when: k8s_scale_replicas_annotation in (item.metadata.annotations | default({}))

# Check `Pod`s, not workload status, as in `tasks/scale_down.yml`.  Wait for
# the recorded replica count of `Pod`s to report Ready.
- name: "Wait for {{ item.kind }}/{{ item.metadata.name }} pods to be ready in {{ k8s_scale_namespace }}"
  kubernetes.core.k8s_info:
    context: "{{ k8s_scale_context }}"
    kind: Pod
    namespace: "{{ item.metadata.namespace }}"
    label_selectors: "{{ k8s_scale_pod_label_selectors }}"
  vars:
    k8s_scale_pod_label_selectors: >-
      {{
        item.spec.selector.matchLabels | dict2items | map(attribute='key')
        | zip(item.spec.selector.matchLabels | dict2items | map(attribute='value'))
        | map('join', '=') | list
      }}
    k8s_scale_target_replicas: "{{ (item.metadata.annotations | default({}))[k8s_scale_replicas_annotation] | int }}"
  register: k8s_scale_up_pods
  until: >-
    (k8s_scale_up_pods.resources
     | selectattr('status.conditions', 'defined')
     | map(attribute='status.conditions')
     | flatten(levels=1)
     | selectattr('type', 'equalto', 'Ready')
     | selectattr('status', 'equalto', 'True')
     | list | length) >= (k8s_scale_target_replicas | int)
  retries: "{{ ((k8s_scale_wait_timeout / k8s_scale_poll_interval) | round(0, 'ceil') | int) + 1 }}"
  delay: "{{ k8s_scale_poll_interval }}"
  loop: "{{ k8s_scale_workloads }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  when: k8s_scale_replicas_annotation in (item.metadata.annotations | default({}))

- name: Initialize the list of workloads with no recoverable replica count
  ansible.builtin.set_fact:
    k8s_scale_missing_annotation: []

# `selfHeal` is off.  A workload missed here stays at zero replicas forever.
# Operator-owned workloads are the exception.  An operator recreates and
# scales its own workloads, for example the `StatefulSet`s the `redis`
# operator builds from `Redis` and `RedisReplication` resources.  The
# `ownerReferences` check below skips those workloads.
- name: Collect workloads at zero replicas with no recorded count that are not operator-owned
  ansible.builtin.set_fact:
    k8s_scale_missing_annotation: "{{ k8s_scale_missing_annotation + [item.kind + '/' + item.metadata.name] }}"
  loop: "{{ k8s_scale_workloads }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  when:
    - k8s_scale_replicas_annotation not in (item.metadata.annotations | default({}))
    - (item.spec.replicas | default(0)) == 0
    - (item.metadata.ownerReferences | default([])) | length == 0

- name: Fail if any workload has no recoverable replica count
  ansible.builtin.fail:
    msg: >-
      The following workloads in {{ k8s_scale_namespace }} are at zero replicas with no
      {{ k8s_scale_replicas_annotation }} annotation to restore from, and are not
      operator-owned: {{ k8s_scale_missing_annotation | join(", ") }}
  when: k8s_scale_missing_annotation | length > 0

# Strict, unlike the matching step on the down path.  A namespace left on
# manual sync forever is a silent failure.
- ansible.builtin.include_tasks: argocd_sync_policy.yml
  vars:
    k8s_scale_argocd_sync_policy: automated
    k8s_scale_argocd_best_effort: false
