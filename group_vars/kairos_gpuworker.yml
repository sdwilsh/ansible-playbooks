---
# `ttm.pages_limit` sets the GTT limit.  GTT is the system memory that the
# GPU can use.  The limit is a ceiling.  The GPU takes the pages on demand,
# and gives the pages back when the workload stops.
#
# This limit and the container memory limits of the node are one budget.
# Change the values together.  The kubelet charges the memory of the
# inference process that is not GTT to `kubepods.slice`, not to the floor.
# Each node has 125.07 GiB of memory, so:
#
#   GTT limit = 125.07 GiB - (the floor of the node)
#
# The working set of all pods must also stay below `allocatable`.  The
# `host_vars` file of the node shows that sum.
#
# An affinity term keeps each model group and each NPU server on one node.
# The floor is thus different on each node, and `kairos__extra_cmdline`
# lives in `host_vars` with the floor table of that node.  A node with no
# entry takes the kernel default of 62.54 GiB.  That default is too small
# for a model group, so the server stops at startup.  It does not put the
# node at risk.
#
# The GPU does not fail safely.  The kernel does not reclaim GTT pages.
# `oom_score` does not count GTT pages.  A change to the limit needs a
# reboot of the node.
#
# `k3s_system_reserved_memory` below tells the kubelet about this memory.
# That argument lowers `allocatable` and the `kubepods.slice` limit.  k3s
# takes the default value of `--enforce-node-allocatable=pods`, so no cgroup
# holds the reservation.
#
# Each node has the same floor of 7.31 GiB.  The `host_vars` file of the
# node adds the container limit of each server to it.
#
# | Item                            |  GiB | Source           |
# | ------------------------------- | ---: | ---------------- |
# | operating system and other pods | 2.84 | measured         |
# | GTT page tables                 | 0.47 | measured         |
# | `eviction-hard` reserve         | 4.00 | kubelet argument |
# | **total**                       | 7.31 |                  |
#
# The 2.84 GiB is the peak working set of the root cgroup less the
# inference container, on gpuworker02 from 2026-11-07 to 2026-11-15.  It
# includes the metrics exporter.  Test pods made the gpuworker01 value too
# large.
#
# The GPU page tables map the GTT, so their size follows the limit: 0.47
# GiB at a limit of 108 GiB, which is 0.44% of the limit.  The floor thus
# holds a term of the limit that it sets, and the limit is:
#
#   GTT limit = (125.07 GiB - the floor with no page tables) / 1.0044
#
# The page tables use 0.43 GiB at a limit of 98 GiB and 0.16 GiB at a limit
# of 36 GiB.  The value of 0.47 GiB covers both limits and the 88 GiB limit
# of gpuworker02.  Keep it on each node.

# This value is the memory that `system-reserved` keeps.  The GPU page
# tables map the GTT ceiling, and they use 0.47 GiB on each node.  A node
# with a model group sets a larger value in `host_vars`.
k3s_system_reserved_memory: 512Mi

k3s_kubelet_args:
  # 4Gi gives the kubelet a margin of approximately four read intervals of
  # 10 seconds.
  #
  # This threshold does not detect the GTT pages that the GPU uses, because
  # the kubelet reads `memory.available` from the root cgroup.  Because of
  # `--enforce-node-allocatable=pods`, the kubelet also evicts when the
  # total working set of all pods is more than `allocatable`.  Refer to
  # `ParseThresholdConfig` in kubernetes pkg/kubelet/eviction/helpers.go.
  - eviction-hard=memory.available<4Gi,imagefs.available<5%,nodefs.available<5%
  # `kube-reserved` is for the operating system, the kubelet, and the
  # container runtime.  No cgroup holds it.  It lowers `allocatable` and the
  # `kubepods.slice` limit, and the floor above counts the measured working
  # set of these parts.
  - kube-reserved=memory=2Gi
  # `system-reserved` keeps memory for a component outside Kubernetes.
  # The amdgpu driver is such a component.  The kubelet does not read GTT
  # pages, so the scheduler needs this value.
  - system-reserved=memory={{ k3s_system_reserved_memory }}

k3s_node_taints:
  - gpu=strixhalo:NoSchedule
