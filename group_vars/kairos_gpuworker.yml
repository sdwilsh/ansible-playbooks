---
# `ttm.pages_limit` sets the GTT limit to 28311552 pages (108 GiB).  GTT is
# the system memory that the GPU can use.  The default limit is
# `MemTotal` / 2, which is 62.54 GiB on each node.  The limit is a ceiling.
# The GPU takes the pages on demand, and gives the pages back when the
# workload stops.
#
# This limit and the `local-llm` container memory limit are one budget.
# Change the two values together.  The kubelet charges the memory of the
# inference process that is not GTT to `kubepods.slice`, not to the floor.
# Each node has 125.07 GiB of memory.  A limit of 108 GiB keeps a floor of
# 17.07 GiB:
#
#   operating system and other pods (measured)   2.21 GiB
#   GTT page tables                              0.47 GiB
#   `local-llm` container limit                 10.00 GiB
#   `eviction-hard` reserve                      4.00 GiB
#   slack                                        0.39 GiB
#
# llama.cpp allocates the KV cache at startup, so the GTT quantity does not
# change with traffic.  A target of two models needs 103.70 GiB.  Two models
# runs at present.
#
# The GPU does not fail safely.  The kernel does not reclaim GTT pages.
# `oom_score` does not count GTT pages.  A change to this value needs a
# reboot of the node.
kairos__extra_cmdline:
  - ttm.pages_limit=28311552

# Do not use `system-reserved` to hold memory for the GPU.  The kernel does
# not charge GTT pages to a cgroup, so a reservation only makes
# `kubepods.slice` smaller.
k3s_kubelet_args:
  # These settings are based on a measured working set of 2.21 GiB.
  # 4Gi is larger than the 2.21 GiB working set, and gives the kubelet a
  # margin of approximately four read intervals of 10 seconds.
  #
  # This threshold does not detect the GTT pages that the GPU uses, because
  # the kubelet reads `memory.available` from the root cgroup.
  - eviction-hard=memory.available<4Gi,imagefs.available<5%,nodefs.available<5%
  # `kube-reserved` keeps memory for the operating system, the kubelet, and
  # the container runtime.  It is larger than the measured working set on
  # purpose.  The budget above uses the measurement, because the kubelet
  # does not enforce this reservation as a cgroup.
  - kube-reserved=memory=6Gi

# FastFlowLM maps NPU memory with `MAP_LOCKED`, which counts against
# `RLIMIT_MEMLOCK`.  A `Pod` with the `restricted` pod security standard cannot
# otherwise raise the limit, so it must be set by the k3s service.
k3s_limit_memlock: 8589934592

k3s_node_taints:
  - gpu=strixhalo:NoSchedule
