---
common__interfaces:
  interfaces:
    - mac: 9c:bf:0d:01:1a:54
      name: enp191s0

common__ip_addresses:
  - 10.11.0.121/23

# The GPU holds 32.48 GiB of GTT at its highest.  The kubelet does not
# read GTT pages, so this value is the 38 GiB limit of this node.  The
# scheduler then sees 79.07 GiB.
k3s_system_reserved_memory: 38Gi

kairos__disks_to_format: []

# This node holds model group B.  `group_vars/kairos_gpuworker.yml` gives
# the common floor and the rule for the largest safe GTT limit.
#
# | Item                  |    GiB | Source            |
# | --------------------- | -----: | ----------------- |
# | common floor          |   7.07 | group vars        |
# | `local-llm` container |  80.00 | group B patch     |
# | GTT for group B       |  38.00 | limit             |
# | **total**             | 125.07 |                   |
# | free for other work   |   0.00 | 125.07 less total |
#
# | Item        | measured | limit | margin |
# | ----------- | -------: | ----: | -----: |
# | group B GTT |    32.48 | 38.00 |   5.52 |
#
# 38 GiB is 9961472 pages.  With gufo v0.21.0.0 the GTT is 32.48 GiB, idle
# and with a 95672-token prompt on each 27B server.  The margin must be at
# least 4 GiB plus one RAM-cache segment, or the Q8 cache gets no memory.
#
# The AMD driver stops a compute job after 2 seconds.  A large context
# makes each job longer, and the GPU then loses its Vulkan context.
# These values permit 180 seconds for a compute job.
kairos__extra_cmdline:
  - amdgpu.lockup_timeout=10000,180000,10000,10000
  - ttm.pages_limit=9961472
