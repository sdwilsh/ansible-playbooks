---
common__interfaces:
  interfaces:
    - mac: 9c:bf:0d:01:1a:54
      name: enp191s0

common__ip_addresses:
  - 10.11.0.121/23

# The GPU holds 78.88 GiB of GTT at its highest.  The kubelet does not
# read GTT pages, so this value is the 84 GiB limit of this node.  The
# scheduler then sees 33.07 GiB.
k3s_system_reserved_memory: 84Gi

kairos__disks_to_format: []

# This node holds model group B.  `group_vars/kairos_gpuworker.yml` gives
# the common floor and the rule for the largest safe GTT limit.
#
# | Item                  |    GiB | Source            |
# | --------------------- | -----: | ----------------- |
# | common floor          |   7.07 | group vars        |
# | `local-llm` container |  24.00 | group B patch     |
# | GTT for group B       |  84.00 | limit             |
# | **total**             | 115.07 |                   |
# | free for other work   |  10.00 | 125.07 less total |
#
# | Item        | measured | limit | margin |
# | ----------- | -------: | ----: | -----: |
# | group B GTT |    78.88 | 84.00 |   5.12 |
#
# 84 GiB is 22020096 pages.  gufo v0.28.0 puts the weights of a model in GTT
# when 4 GiB stays free after them.  With 38 GiB, Q8 did not get the GTT
# for its session state, and it did not start.  With 84 GiB, both weight
# sets fit, and the GTT peaks at 78.88 GiB.  The weights then use no
# container memory, so the container needs 24 GiB.
#
# Q4 has no RAM cache, and Q8 has 6 GiB.  Q4 also has the image projector,
# because gufo loads a projector beside the model.
#
# The AMD driver stops a compute job after 2 seconds.  A large context
# makes each job longer, and the GPU then loses its Vulkan context.
# These values permit 180 seconds for a compute job.
kairos__extra_cmdline:
  - amdgpu.lockup_timeout=10000,180000,10000,10000
  - ttm.pages_limit=22020096
