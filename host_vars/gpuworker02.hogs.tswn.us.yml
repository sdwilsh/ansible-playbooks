---
common__interfaces:
  interfaces:
    - mac: 9c:bf:0d:01:1a:54
      name: enp191s0

common__ip_addresses:
  - 10.11.0.121/23

# The kubelet does not read GTT pages, so this value is the 88 GiB GTT
# limit of this node.  The scheduler then sees 31.07 GiB.
k3s_system_reserved_memory: 88Gi

kairos__disks_to_format: []

# This node holds model group B.  `group_vars/kairos_gpuworker.yml` gives
# the common floor and the rule for the largest safe GTT limit.
#
# | Item                  |    GiB | Source            |
# | --------------------- | -----: | ----------------- |
# | common floor          |   7.31 | group vars        |
# | `local-llm` container |  24.00 | group B patch     |
# | GTT for group B       |  88.00 | limit             |
# | **total**             | 119.31 |                   |
# | host memory not used  |   5.76 | 125.07 less total |
#
# The pods total must stay below `allocatable`.  `allocatable` is 31.07
# GiB: 125.07 less 88 `system-reserved`, 2 `kube-reserved` and 4
# `eviction-hard`.
#
# | Item                  |   GiB | Source                        |
# | --------------------- | ----: | ----------------------------- |
# | `local-llm` container | 24.00 | group B patch                 |
# | other pods            |  2.35 | peak, 2026-11-07 to 11-15     |
# | **total**             | 26.35 |                               |
#
# | Item                  | measured | limit | margin |
# | --------------------- | -------: | ----: | -----: |
# | Q8 and ASR            |    57.66 |       |        |
# | EmbeddingGemma 2      |     3.11 |       |        |
# | group B GTT           |    60.77 | 88.00 |  27.23 |
#
# 88 GiB is 23068672 pages.  gufo puts the weights of a model in GTT when
# 4 GiB stays free after them.  The weights then use no container memory,
# so the container needs 24 GiB.  A change to the limit needs a reboot.
#
# gufo loads the image projector beside the model.  The Q8 and ASR value
# is the peak GTT during image requests to Q8, less a ready EmbeddingGemma
# 2 (1.10 GiB).  Q8 takes the GTT for its context at load.  A prompt of
# 251848 tokens and image requests then added 0.41 GiB.
#
# EmbeddingGemma 2 holds 1.10 GiB of GTT when it is ready.  The first image
# and the first audio request add their encoders, for 3.11 GiB.
#
# The AMD driver stops a compute job after 2 seconds.  A large context
# makes each job longer, and the GPU then loses its Vulkan context.
# These values permit 180 seconds for a compute job.
kairos__extra_cmdline:
  - amdgpu.lockup_timeout=10000,180000,10000,10000
  - ttm.pages_limit=23068672
