# This node holds model group A.  `group_vars/kairos_gpuworker.yml` gives
# the common floor and the rule for this value.  The floor of this node:
#
# | Item                  |   GiB | Source     |
# | --------------------- | ----: | ---------- |
# | common floor          |  7.07 | group vars |
# | `local-llm` container | 10.00 | limit      |
# | **total**             | 17.07 |            |
#
# 125.07 - 17.07 = 108 GiB, which is 28311552 pages.  Group A takes:
#
# | Item                          |   GiB | Source     |
# | ----------------------------- | ----: | ---------- |
# | Ling weights + KV, 131072     | 63.15 | measured   |
# | 35B aux weights               | 20.82 | server log |
# | 35B aux KV cache, 131072      |  1.33 | server log |
# | compute buffers and overhead  |  1.69 | maths      |
# | **total**                     | 86.99 | projected  |
# | headroom to the 108 GiB limit | 21.01 | maths      |
#
# Ling holds 131072 tokens, not its trained 262144.  The GPU loses its
# Vulkan context above approximately 141000 tokens.
kairos__extra_cmdline:
  - ttm.pages_limit=28311552
