---
common__interfaces:
  interfaces:
    - mac: 9c:bf:0d:01:f7:24
      name: enp191s0

common__ip_addresses:
  - 10.11.0.120/23

# The GPU holds 94.07 GiB of GTT.  The kubelet does not read GTT pages,
# so this value is the 98 GiB limit of this node.  The scheduler then
# sees 19.07 GiB.
k3s_system_reserved_memory: 98Gi

kairos__disks_to_format: []

# This node holds model group A.  `group_vars/kairos_gpuworker.yml` gives
# the common floor and the rule for the largest safe GTT limit.
#
# | Item                  |    GiB | Source            |
# | --------------------- | -----: | ----------------- |
# | common floor          |   7.07 | group vars        |
# | `local-llm` container |  20.00 | group A patch     |
# | GTT for group A       |  98.00 | limit             |
# | **total**             | 125.07 |                   |
# | free for other work   |   0.00 | 125.07 less total |
#
# Each limit holds a margin over a measurement:
#
# | Item             | measured | limit | margin |
# | ---------------- | -------: | ----: | -----: |
# | group A GTT      |    94.07 | 98.00 |   3.93 |
# | container memory |    11.93 | 20.00 |   8.07 |
#
# 98 GiB is 25690112 pages.  The GTT peak is 94.07 GiB with gufo v0.21.0.0
# and DeepSeek V4 Flash with DSpark at 196608 tokens.  The container held
# 11.93 GiB at its highest, with a 4 GiB RAM cache.  The DSpark model uses
# host memory, so a 15 GiB RAM cache does not fit the 20 GiB limit.
#
# The AMD driver stops a compute job after 2 seconds.  A large context
# makes each job longer, and the GPU then loses its Vulkan context.
# These values permit 180 seconds for a compute job.
kairos__extra_cmdline:
  - amdgpu.lockup_timeout=10000,180000,10000,10000
  - ttm.pages_limit=25690112
