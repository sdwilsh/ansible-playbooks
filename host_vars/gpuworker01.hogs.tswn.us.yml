---
common__interfaces:
  interfaces:
    - mac: 9c:bf:0d:01:f7:24
      name: enp191s0

common__ip_addresses:
  - 10.11.0.120/23

# The GPU holds 91.28 GiB of GTT.  The kubelet does not read GTT pages,
# so this value is the 96 GiB limit of this node.  The scheduler then
# sees 19.07 GiB.
k3s_system_reserved_memory: 96Gi

kairos__disks_to_format: []

# This node holds model group A.  `group_vars/kairos_gpuworker.yml` gives
# the common floor and the rule for the largest safe GTT limit.
#
# This node takes less than that rule permits.  A measurement gives what
# group A needs, and the node keeps the rest for other work.
#
# | Item                  |    GiB | Source            |
# | --------------------- | -----: | ----------------- |
# | common floor          |   7.07 | group vars        |
# | `local-llm` container |   8.00 | group A patch     |
# | GTT for group A       |  96.00 | limit             |
# | **total**             | 111.07 |                   |
# | free for other work   |  14.00 | 125.07 less total |
#
# Each limit holds a margin over a measurement:
#
# | Item             | measured | limit | margin |
# | ---------------- | -------: | ----: | -----: |
# | group A GTT      |    91.28 | 96.00 |   4.72 |
# | container memory |     4.21 |  8.00 |   3.79 |
#
# 96 GiB is 25165824 pages.  `gpu_used_gtt` gave 93475 MiB for four
# samples, for both models at 196608 tokens.  The container held 4311
# MiB at its highest, under a session of agent work.
# Ling holds 196608 tokens.  The model trains to 262144.
#
# The AMD driver stops a compute job after 2 seconds.  A large context
# makes each job longer, and the GPU then loses its Vulkan context.
# These values permit 180 seconds for a compute job.
kairos__extra_cmdline:
  - amdgpu.lockup_timeout=10000,180000,10000,10000
  - ttm.pages_limit=25165824
