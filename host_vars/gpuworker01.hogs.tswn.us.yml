---
common__interfaces:
  interfaces:
    - mac: 9c:bf:0d:01:f7:24
      name: enp191s0

common__ip_addresses:
  - 10.11.0.120/23

# The GPU holds up to 97.62 GiB of GTT.  The kubelet does not read GTT pages,
# so this value is the 98 GiB limit of this node.  The scheduler then
# sees 21.07 GiB.
k3s_system_reserved_memory: 98Gi

kairos__disks_to_format: []

# This node holds model group A.  `group_vars/kairos_gpuworker.yml` gives
# the common floor and the rule for the largest safe GTT limit.
#
# | Item                  |    GiB | Source            |
# | --------------------- | -----: | ----------------- |
# | common floor          |   7.31 | group vars        |
# | `local-llm` container |  18.00 | group A patch     |
# | GTT for group A       |  98.00 | limit             |
# | **total**             | 123.31 |                   |
# | host memory not used  |   1.76 | 125.07 less total |
#
# The pods total must stay below `allocatable`.  `allocatable` is 21.07
# GiB: 125.07 less 98 `system-reserved`, 2 `kube-reserved` and 4
# `eviction-hard`.
#
# | Item                  |   GiB | Source                        |
# | --------------------- | ----: | ----------------------------- |
# | `local-llm` container | 18.00 | group A patch                 |
# | other pods            |  2.32 | peak, 2026-11-07 to 11-15     |
# | **total**             | 20.32 |                               |
#
# Each limit holds a margin over a measurement:
#
# | Item                  | measured | limit | margin |
# | --------------------- | -------: | ----: | -----: |
# | group A GTT           |    97.62 | 98.00 |   0.38 |
# | container working set |    14.55 | 18.00 |   3.45 |
#
# 98 GiB is 25690112 pages.  From 2026-11-07 to 2026-11-15, the GTT peak
# is 97.62 GiB (`gpu_used_gtt`) with DeepSeek V4 Flash and DSpark at
# 196608 tokens.  The working set of the container peaked at 14.55 GiB,
# with a 4 GiB RAM cache.  Measure the peak again before you change the
# RAM cache or lower the container limit.
#
# The AMD driver stops a compute job after 2 seconds.  A large context
# makes each job longer, and the GPU then loses its Vulkan context.
# These values permit 180 seconds for a compute job.
kairos__extra_cmdline:
  - amdgpu.lockup_timeout=10000,180000,10000,10000
  - ttm.pages_limit=25690112
