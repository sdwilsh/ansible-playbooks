---
# The data volume is ReadWriteOnce, so the old pod must stop before the new
# one starts.  Recreate does this too, but under server-side apply the
# defaulted rollingUpdate stays and the API server rejects the Deployment.
- op: replace
  path: /spec/strategy
  value:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
