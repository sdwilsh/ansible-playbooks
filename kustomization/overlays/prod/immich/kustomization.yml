---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/cnpg-backup
  - ../../../components/cnpg-podmonitor
  - ../../../components/immich
  - ../../../components/networkpolicy-allow-from-cnpg-operator
  - ../../../components/networkpolicy-allow-from-prometheus
  - ../../../components/networkpolicy-allow-from-prometheus-to-cnpg-cluster
  - ../../../components/networkpolicy-allow-from-traefik
  - ../../../components/networkpolicy-allow-to-api-server
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/networkpolicy-allow-to-traefik
  - ../../../components/networkpolicy-allow-within-this-namespace
  - ../../../components/networkpolicy-deny-all
  - ../../../components/pod-security-enforce-restricted
images:
  - name: docker.io/bitnami/kubectl
    newTag: latest@sha256:bedd34c910e2a5ce9836813d16444af449d7fe07a29136d59f34e861e8e660c5
  - name: ghcr.io/immich-app/immich-server
    newTag: v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
  - name: ghcr.io/immich-app/immich-machine-learning
    newTag: v3.3.5@sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56
  - name: postgres
    newTag: 18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
namespace: immich
patches:
  # cnpg
  - path: patches/cnpg/set_backup_path.yml
    target:
      kind: ObjectStore
      name: garage-objectstore
  # immich
  - path: patches/add_postgres.yml
    target:
      kind: Deployment
      name: immich-server
  - path: patches/add_traefik_client_label.yml
    target:
      kind: Deployment
      name: immich-server
  - path: patches/restrict_machine-learning.yml
    target:
      kind: Deployment
      name: immich-machine-learning
  - path: patches/restrict_server.yml
    target:
      kind: Deployment
      name: immich-server
  - path: patches/restrict_valkey.yml
    target:
      kind: Deployment
      name: immich-valkey
  - path: patches/add_traefik_route_label.yml
    target:
      kind: Deployment
      name: immich-server
  - path: patches/add_prometheus_target_label.yml
    target:
      kind: Deployment
      name: immich-server
  - path: patches/set_prometheus_networkpolicy_ports.yml
    target:
      kind: NetworkPolicy
      name: allow-from-prometheus-networkpolicy
replacements:
  - source:
      fieldPath: spec.template.spec.containers.[name=main].ports.[name=http].name
      kind: Deployment
      name: immich-server
    targets:
      - fieldPaths:
          - spec.ingress.0.ports.[port=web].port
        select:
          kind: NetworkPolicy
          name: allow-from-traefik-networkpolicy
resources:
  - namespace.yml
  - cnpg/backup.yml
  - cnpg/cluster.yml
  - cnpg/database.yml
  - cnpg/scheduledbackup.yml
  - ingress.yml
