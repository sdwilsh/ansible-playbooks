---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-home-vlan-networkpolicy
spec:
  ingress:
    - from:
        - ipBlock:
            cidr: 10.117.0.9/32 # lighterthansome, on HOME
      ports:
        - port: web
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: proxy-registry
  policyTypes:
    - Ingress
