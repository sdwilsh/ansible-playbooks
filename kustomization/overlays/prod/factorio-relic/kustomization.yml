---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - https://github.com/marinatedconcrete/config/kustomization/components/factorio?ref=kustomize-factorio@v1.0.0
  - ../../../components/networkpolicy-allow-from-choros
  - ../../../components/networkpolicy-allow-from-home-vlan
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/networkpolicy-allow-to-internet
  - ../../../components/networkpolicy-allow-within-this-namespace
  - ../../../components/networkpolicy-deny-all
  - ../../../components/pod-security-enforce-restricted
namespace: factorio-relic
patches:
  - path: patches/add_internet_client_label.yml
    target:
      kind: StatefulSet
      name: factorio-statefulset
  - path: patches/add_traefik_route_label.yml
    target:
      kind: StatefulSet
      name: factorio-statefulset
  - path: patches/set_load_balancer.yml
    target:
      kind: Service
      name: factorio-game-svc
  - path: patches/use_stable_factorio_version.yml
    target:
      kind: StatefulSet
      name: factorio-statefulset
  - path: patches/set_resources.yml
    target:
      kind: StatefulSet
      name: factorio-statefulset
  - path: patches/avoid_control_plane.yml
    target:
      kind: StatefulSet
      name: factorio-statefulset
  - path: patches/add_choros_target_label.yml
    target:
      kind: StatefulSet
      name: factorio-statefulset
  - path: patches/add_home_vlan_target_label.yml
    target:
      kind: StatefulSet
      name: factorio-statefulset
  - path: patches/set_game_networkpolicy_ports.yml
    target:
      kind: NetworkPolicy
      name: allow-from-(choros|home-vlan)-networkpolicy
resources:
  - namespace.yml
  - ingress.yml
  - networkpolicy/allow-to-admin-from-traefik.yml
