---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    # Wave 1 applies the deny-all policy after the pods that have the new
    # labels run.  Old pods have no labels, so they lose every path at once.
    argocd.argoproj.io/sync-wave: "1"
  name: deny-all-networkpolicy
