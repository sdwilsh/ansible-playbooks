---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-pg-cluster
spec:
  backup:
    target: primary
  # This cluster's app database/role are "forgejodb"/"forgejo", not CNPG's
  # default "app"/"app".  Any future bootstrap.recovery or
  # bootstrap.pg_basebackup MUST set bootstrap.<type>.database/owner to
  # match, or CNPG will create a fresh empty "app"/"app" database instead of
  # using the real one physically present in the cloned/restored data.
  bootstrap:
    initdb:
      database: forgejodb
      dataChecksums: true
      localeCType: en_US.UTF-8
      localeCollate: en_US.UTF-8
      owner: forgejo
  env:
    - name: TZ
      value: America/Los_Angeles
  imageName: ghcr.io/cloudnative-pg/postgresql:18@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  instances: 3
  managed:
    services:
      disabledDefaultServices:
        - r
  monitoring:
    tls:
      enabled: true
  plugins:
    - enabled: true
      isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: garage-objectstore
        # Pinned to a distinct server identity because this cluster was
        # recreated on 2026-08-18 after the original's data was lost; the
        # object store still holds the original cluster's WAL/backup
        # history under the "forgejo-pg-cluster" name, and barman-cloud
        # refuses to archive a different Postgres system ID into an
        # existing, non-empty archive path for that name.
        serverName: forgejo-pg-cluster-2026-08-18
  postgresql:
    synchronous:
      failoverQuorum: true
      method: any
      number: 1
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  priorityClassName: application-infra
  storage:
    size: 10Gi
    storageClass: cnpg-data-encrypted-storage
  walStorage:
    size: 8Gi
    storageClass: cnpg-wal-encrypted-storage
