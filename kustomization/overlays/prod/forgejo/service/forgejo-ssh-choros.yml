---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kube-vip.io/loadbalancerIPs: 10.11.3.70
  name: forgejo-ssh-choros-svc
spec:
  externalTrafficPolicy: Local
  loadBalancerClass: kube-vip.io/wireguard
  ports:
    - name: ssh
      port: 2222
      protocol: TCP
      targetPort: ssh
  selector:
    app.kubernetes.io/instance: forgejo
    app.kubernetes.io/name: forgejo
  type: LoadBalancer
