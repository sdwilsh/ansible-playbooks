---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/cnpg-backup
  - ../../../components/cnpg-podmonitor
  - ../../../components/networkpolicy-allow-from-cnpg-operator
  - ../../../components/networkpolicy-allow-from-prometheus-to-cnpg-cluster
  - ../../../components/networkpolicy-allow-from-traefik
  - ../../../components/networkpolicy-allow-to-api-server
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/networkpolicy-allow-to-garage
  - ../../../components/networkpolicy-allow-to-traefik
  - ../../../components/networkpolicy-allow-within-this-namespace
  - ../../../components/networkpolicy-deny-all
  - ../../../components/pod-security-enforce-restricted
helmCharts:
  - name: forgejo
    version: 17.2.0
    repo: oci://code.forgejo.org/forgejo-helm
    releaseName: forgejo
    valuesFile: values.yml
images:
  - name: code.forgejo.org/forgejo/forgejo
    newTag: 16.0.6-rootless@sha256:51b47921660e1ec7127f094208fe06901ba57df4fe6d59fcccc3a2419514a77f
  - name: docker.io/bitnami/kubectl
    newTag: latest@sha256:dbe04f493d362c47db291edb3382aeb56cf430a6271daa56311f5b8e82fecf2a
namespace: forgejo
patches:
  - path: patches/cnpg/set_backup_path.yml
    target:
      kind: ObjectStore
      name: garage-objectstore
  - path: patches/forgejo/add_garage_client_label.yml
    target:
      kind: Deployment
      name: forgejo
  - path: patches/forgejo/add_traefik_client_label.yml
    target:
      kind: Deployment
      name: forgejo
  - path: patches/forgejo/add_traefik_route_label.yml
    target:
      kind: Deployment
      name: forgejo
replacements:
  - source:
      fieldPath: spec.template.spec.containers.[name=forgejo].ports.[name=http].name
      kind: Deployment
      name: forgejo
    targets:
      - fieldPaths:
          - spec.ingress.0.ports.[port=web].port
        select:
          kind: NetworkPolicy
          name: allow-from-traefik-networkpolicy
resources:
  - namespace.yml
  - cnpg/backup.yml
  - cnpg/cluster.yml
  - cnpg/scheduledbackup.yml
  - networkpolicy/allow-ssh.yml
