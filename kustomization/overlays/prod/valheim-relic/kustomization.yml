---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/valheim
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/networkpolicy-allow-from-prometheus
  - ../../../components/networkpolicy-allow-to-internet
  - ../../../components/networkpolicy-allow-within-this-namespace
  - ../../../components/networkpolicy-deny-all
  - ../../../components/schedule-avoid-control-plane
namespace: valheim-relic
patches:
  - path: patches/add_internet_client_label.yml
    target:
      kind: StatefulSet
      name: valheim-statefulset
  - path: patches/add_prometheus_target_label.yml
    target:
      kind: StatefulSet
      name: valheim-statefulset
  - path: patches/add_steam_ports_to_internet.yml
    target:
      kind: NetworkPolicy
      name: allow-to-internet-networkpolicy
  - path: patches/add_valheim_env_vars.yml
    target:
      kind: StatefulSet
      name: valheim-statefulset
  - path: patches/set_load_balancer.yml
    target:
      kind: Service
      name: valheim-svc
resources:
  - namespace.yml
  - networkpolicy/allow-to-game-from-choros-and-home.yml
  - podmonitor.yml
