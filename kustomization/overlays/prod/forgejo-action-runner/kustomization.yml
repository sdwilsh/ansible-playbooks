---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/forgejo-scaled-runner
configMapGenerator:
  - name: runner-config-configmap
    files:
      - configmap/config.yml
  - name: daemon-config-configmap
    files:
      - configmap/daemon.json
      - configmap/registries.conf
      - configmap/storage.conf
images:
  - name: code.forgejo.org/forgejo/runner
    newTag: 13.0.0@sha256:7fb853bfe73c229be6349398359c0a7bd01fadfd17c106607b2221150b799ed2
  - name: docker.io/library/docker
    newTag: 29.7.2-dind-rootless@sha256:8a213afdd096a44dff403aaf8eb58b7a96a63113f18a4b094b98b7d0ed7d948b
namespace: forgejo-action-runner
openapi:
  path: openapi.yml
patches:
  - path: patches/configure-scaledjob.yml
    target:
      kind: ScaledJob
      name: forgejo-runner-scaledjob
resources:
  - namespace.yml
