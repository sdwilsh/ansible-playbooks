---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: manyfold-redis
spec:
  kubernetesConfig:
    image: quay.io/opstree/redis
    imagePullPolicy: IfNotPresent
    redisSecret:
      key: redis_password
      name: manyfold-secret
    resources:
      requests:
        cpu: 101m
        memory: 128Mi
      limits:
        cpu: 101m
        memory: 128Mi
  podSecurityContext:
    fsGroup: 1000 # redis
    runAsUser: 1000 # redis
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
    seccompProfile:
      type: RuntimeDefault
