---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/cnpg-backup
  - ../../../components/cnpg-podmonitor
  - ../../../components/networkpolicy-allow-from-cnpg-operator
  - ../../../components/networkpolicy-allow-from-prometheus-to-cnpg-cluster
  - ../../../components/networkpolicy-allow-from-traefik
  - ../../../components/networkpolicy-allow-to-api-server
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/networkpolicy-allow-to-internet
  - ../../../components/networkpolicy-allow-to-traefik
  - ../../../components/networkpolicy-allow-within-this-namespace
  - ../../../components/networkpolicy-deny-all
  - ../../../components/schedule-avoid-control-plane
helmCharts:
  - name: manyfold
    version: 1.0.3
    repo: https://charts.jeffresc.dev
    releaseName: manyfold
    valuesFile: values.yml
images:
  - name: busybox
    newTag: 1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
  - name: ghcr.io/manyfold3d/manyfold
    newTag: 0.153.0@sha256:f69029a8f21b76de0b1558f175de19009324f96e4ecd80143997e97174c08fa4
namespace: manyfold
patches:
  - path: patches/add_traefik_client_label.yml
    target:
      kind: Deployment
      name: manyfold
  - path: patches/harden_deployment.yml
    target:
      kind: Deployment
      name: manyfold
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Pod
      metadata:
        name: manyfold-test-connection
    target:
      kind: Pod
      name: manyfold-test-connection
  - path: patches/cnpg/set_backup_path.yml
    target:
      kind: ObjectStore
      name: garage-objectstore
  - path: patches/add_traefik_route_label.yml
    target:
      kind: Deployment
      name: manyfold
  - path: patches/add_internet_client_label.yml
    target:
      kind: Deployment
      name: manyfold
replacements:
  - source:
      fieldPath: spec.template.spec.containers.[name=manyfold].ports.[name=http].name
      kind: Deployment
      name: manyfold
    targets:
      - fieldPaths:
          - spec.ingress.0.ports.[port=web].port
        select:
          kind: NetworkPolicy
          name: allow-from-traefik-networkpolicy
resources:
  - namespace.yml
  - cnpg/backup.yml
  - cnpg/cluster.yml
  - cnpg/scheduledbackup.yml
  - redis.yml
