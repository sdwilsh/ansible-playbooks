---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: disc-ripper-sweep-rules
spec:
  groups:
    - name: disc-ripper
      interval: 1m
      rules:
        - alert: disc-ripper-sweep-failed
          annotations:
            description: "The last run of the CronJob {{ $labels.exported_namespace }}/{{ $labels.cronjob }} ended without success."
          # A run that never succeeded has no last_successful_time, so 0 stands in.
          expr: |
            max by (exported_namespace, cronjob) (kube_cronjob_status_last_schedule_time{exported_namespace="disc-ripper"})
              > max by (exported_namespace, cronjob) (kube_cronjob_status_last_successful_time{exported_namespace="disc-ripper"} or kube_cronjob_status_last_schedule_time{exported_namespace="disc-ripper"} * 0)
            and max by (exported_namespace, cronjob) (kube_cronjob_status_active{exported_namespace="disc-ripper"}) == 0
          for: 5m
          labels:
            severity: warning
        # A pod that cannot start (no CA Secret, no image) keeps its Job
        # active.  The rule above then stays silent, and Forbid skips each
        # later run.  A deadline would also stop a long sweep.
        - alert: disc-ripper-pod-not-started
          annotations:
            description: "The pod {{ $labels.exported_namespace }}/{{ $labels.exported_pod }} is Pending for more than 30 minutes.  Its Job stays active, so the CronJob skips each later run."
          expr: max by (exported_namespace, exported_pod) (kube_pod_status_phase{exported_namespace="disc-ripper", phase="Pending"}) == 1
          for: 30m
          labels:
            severity: warning
