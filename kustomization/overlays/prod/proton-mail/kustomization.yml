---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/networkpolicy-allow-from-traefik
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/networkpolicy-allow-to-internet
  - ../../../components/networkpolicy-deny-all
  - ../../../components/pod-security-enforce-restricted
  - ../../../components/proton-bridge
namespace: proton-mail
patches:
  - path: patches/add_internet_client_label.yml
    target:
      kind: StatefulSet
      name: proton-bridge-statefulset
  - path: patches/add_traefik_route_label.yml
    target:
      kind: StatefulSet
      name: proton-bridge-statefulset
  - path: patches/set_traefik_networkpolicy_ports.yml
    target:
      kind: NetworkPolicy
      name: allow-from-traefik-networkpolicy
resources:
  - namespace.yml
  - ingressroutetcp.yml
  - networkpolicy/allow-from-proton-bridge-clients.yml
