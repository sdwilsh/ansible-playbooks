---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/cert-manager
  - ../../../components/pod-security-enforce-restricted
  - ../../../components/schedule-prefer-control-plane
patches:
  - path: patches/add_dns01_recursive_nameservers.yml
    target:
      kind: Deployment
      name: cert-manager
  - path: patches/add_api_server_target_label.yml
    target:
      kind: Deployment
      name: cert-manager-webhook
  - path: patches/add_internet_client_label.yml
    target:
      kind: Deployment
      name: cert-manager
  - path: patches/add_namespace_prometheus_target_label.yml
    target:
      kind: Namespace
      name: cert-manager
  - path: patches/add_networkpolicy_labels.yml
    target:
      kind: Deployment
  - path: patches/increase_replicas.yml
resources:
  - clusterissuer.yml
