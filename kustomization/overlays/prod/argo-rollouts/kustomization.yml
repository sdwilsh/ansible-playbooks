---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/networkpolicy-allow-to-api-server
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/networkpolicy-deny-all
  - ../../../components/pod-security-enforce-restricted
  - ../../../components/schedule-prefer-control-plane
namespace: argo-rollouts
patches:
  - path: patches/add_api_server_client_label.yml
    target:
      kind: Deployment
      name: argo-rollouts
resources:
  - namespace.yml
  # renovate: datasource=github-releases
  - https://github.com/argoproj/argo-rollouts/releases/download/v1.10.2/install.yaml
