---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ttl-registry-networkpolicy
spec:
  egress:
    - ports:
        - port: web
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ttl-hooks
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - ttl-hooks
                  - ttl-reaper
      ports:
        - port: web
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ttl-registry
  policyTypes:
    - Egress
    - Ingress
