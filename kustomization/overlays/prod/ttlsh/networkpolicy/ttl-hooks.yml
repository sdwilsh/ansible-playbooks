---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ttl-hooks-networkpolicy
spec:
  egress:
    - ports:
        - port: web
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ttl-registry
    - ports:
        - port: 6379
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app: ttl-redis
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ttl-registry
      ports:
        - port: web
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ttl-hooks
  policyTypes:
    - Egress
    - Ingress
