---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-mcp-clients-middleware@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
  name: kubernetes-mcp-ingress
spec:
  rules:
    - host: kubernetes-mcp.hogs.tswn.us
      http:
        paths:
          - backend:
              service:
                name: kubernetes-mcp-svc
                port:
                  name: web
            path: /
            pathType: Prefix
