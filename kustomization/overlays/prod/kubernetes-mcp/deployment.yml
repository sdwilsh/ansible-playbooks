---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-mcp
        hogs.tswn.us/api-server-client: "true"
        hogs.tswn.us/bifrost-route: "true"
    spec:
      automountServiceAccountToken: true
      containers:
        - args:
            - --config
            - /etc/kubernetes-mcp/server.toml
          image: ghcr.io/containers/kubernetes-mcp-server
          livenessProbe:
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: web
            timeoutSeconds: 5
          name: kubernetes-mcp
          ports:
            - containerPort: 8080
              name: web
          readinessProbe:
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: web
            timeoutSeconds: 5
          resources:
            limits:
              memory: 192Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/kubernetes-mcp
              name: config
              readOnly: true
      enableServiceLinks: false
      priorityClassName: application-infra
      serviceAccountName: kubernetes-mcp
      volumes:
        - configMap:
            name: kubernetes-mcp-configmap
          name: config
