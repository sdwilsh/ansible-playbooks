---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/networkpolicy-allow-from-bifrost
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/networkpolicy-allow-to-grafana
  - ../../../components/networkpolicy-deny-all
  - ../../../components/pod-security-enforce-restricted
configMapGenerator:
  - name: grafana-mcp-configmap
    literals:
      # The server reads Loki and Prometheus through Grafana's datasource
      # proxy.  Grafana is the only host that it must reach.
      - GRAFANA_URL=http://grafana.monitoring.svc.cluster.local
images:
  - name: docker.io/grafana/mcp-grafana
    newTag: 2.2.0@sha256:697336440e34878f8e0b26a69675db8d7e97b4d0daec25ec5441c85ac6c60e81
namespace: grafana-mcp
resources:
  - namespace.yml
  - deployment.yml
  - service.yml
