---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-mcp
        hogs.tswn.us/bifrost-route: "true"
        hogs.tswn.us/traefik-route: "true"
        hogs.tswn.us/grafana-client: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            # The server holds a Grafana credential.  It must not write.
            # This flag removes the create tools, the update tools and the
            # delete tools.
            - -disable-write
            # Each tool schema costs tokens on every agent turn.  This list
            # keeps the tools that read Loki, Prometheus, dashboards and
            # alerts.  It removes the Grafana Cloud tools.  This cluster does
            # not have Grafana Cloud.  It also removes `docs` and `proxied`.
            # Those two tools connect to the internet and to other MCP
            # servers.
            - -enabled-tools
            - alerting,dashboard,datasource,folder,loki,prometheus,search
            - -transport
            - streamable-http
            - -address
            - $(POD_IP):8000
            # Bifrost reaches this server on the pod network, so the Host
            # header carries the name of the Service.  This server compares
            # the port as well, so each name needs the form with the port
            # and the form without it.
            - -allowed-hosts
            - grafana-mcp.hogs.tswn.us,grafana-mcp-svc.grafana-mcp.svc.cluster.local:8000
            # The default limit is 10 seconds.  A Loki query over the full
            # 1 week of retention takes about 4.5 seconds at the query
            # frontend, before the Grafana proxy adds its own time.
            - -grafana-timeout
            - 60s
          # The image entrypoint also sets `--transport sse`.  This command
          # replaces the entrypoint.  The flags above are then the whole
          # command line.
          command:
            - /app/mcp-grafana
          env:
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  key: GRAFANA_SERVICE_ACCOUNT_TOKEN
                  name: grafana-mcp-secret
            - name: GRAFANA_URL
              valueFrom:
                configMapKeyRef:
                  key: GRAFANA_URL
                  name: grafana-mcp-configmap
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          image: docker.io/grafana/mcp-grafana
          livenessProbe:
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: web
            timeoutSeconds: 5
          name: grafana-mcp
          ports:
            - containerPort: 8000
              name: web
          readinessProbe:
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: web
            timeoutSeconds: 5
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
      enableServiceLinks: false
      priorityClassName: application-infra
