---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-controller-manager-to-instances-networkpolicy
spec:
  egress:
    - ports:
        - port: status
          protocol: TCP
      to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: cloudnative-pg
              cnpg.io/podRole: instance
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  policyTypes:
    - Egress
