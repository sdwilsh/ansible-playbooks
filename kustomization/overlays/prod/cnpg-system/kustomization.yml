---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/schedule-prefer-control-plane
  - ../../../components/pod-security-enforce-restricted
configMapGenerator:
  - name: cnpg-scripts-configmap
    files:
      - configmap/restart-cnpg-if-needed.sh
images:
  - name: docker.io/bitnami/kubectl
    newTag: latest@sha256:8919c149c2e3d6860e0143c117900e64d71395172aaef0e01e604bb98c8e7ce0
namespace: cnpg-system
resources:
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/main/releases/cnpg-1.30.1.yaml
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.16.0/manifest.yaml
  - configmap.yml
  - job.yml
  - podmonitor.yml
  - rbac.yml
  - storageclass/data.yml
  - storageclass/legacy.yml
  - storageclass/wal.yml
