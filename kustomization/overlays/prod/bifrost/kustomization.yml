---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/cnpg-backup
  - ../../../components/cnpg-podmonitor
  - ../../../components/networkpolicy-allow-from-cnpg-operator
  - ../../../components/networkpolicy-allow-from-prometheus-to-cnpg-cluster
  - ../../../components/networkpolicy-allow-from-traefik
  - ../../../components/networkpolicy-allow-to-api-server
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/networkpolicy-allow-to-internet
  - ../../../components/networkpolicy-allow-within-this-namespace
  - ../../../components/networkpolicy-deny-all
  - ../../../components/pod-security-enforce-restricted
configMapGenerator:
  # This file may set governance.budgets and governance.rate_limits.  Do
  # not set providers, governance.pricing_overrides, or
  # governance.virtual_keys here.  Bifrost replaces the database content
  # of any section this file sets, on every sync.  Manage those three
  # through the dashboard instead.
  - name: bifrost-config-configmap
    files:
      - configmap/config.json
images:
  - name: docker.io/bitnami/kubectl
    newTag: latest@sha256:8f59408f9e896fc8992a0660a56687545bd06751f26531b4a26fca6d5dc7562d
  - name: docker.io/maximhq/bifrost
    newTag: v2.3.2@sha256:f5b18826349fe9e1c402c10d19f1cbb5567a3c800ad928580d07f72e69106ec7
  - name: postgres
    newTag: 18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
namespace: bifrost
patches:
  - path: patches/cnpg/set_backup_path.yml
    target:
      kind: ObjectStore
      name: garage-objectstore
resources:
  - namespace.yml
  - cnpg/backup.yml
  - cnpg/cluster.yml
  - cnpg/scheduledbackup.yml
  - deployment.yml
  - ingress/bifrost-llm-api.yml
  - ingress/bifrost.yml
  - networkpolicy/allow-from-prometheus.yml
  - networkpolicy/allow-to-mcp-servers.yml
  - networkpolicy/allow-to-model-servers.yml
  - podmonitor.yml
  - prometheusrule.yml
  - service.yml
