---
# This is for agents to communicate with Bifrost.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure,websecure-ext
    traefik.ingress.kubernetes.io/router.tls: "true"
  name: bifrost-llm-api-ingress
spec:
  rules:
    - host: bifrost.tswn.us
      http:
        paths:
          - backend:
              service:
                name: bifrost-svc
                port:
                  name: web
            path: /mcp
            pathType: Prefix
          - backend:
              service:
                name: bifrost-svc
                port:
                  name: web
            path: /v1
            pathType: Prefix

