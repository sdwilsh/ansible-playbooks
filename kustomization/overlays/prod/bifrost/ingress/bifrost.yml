---
# This `Ingress` serves the dashboard and the management API.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: auth-forwardauth-middleware@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "10"
    traefik.ingress.kubernetes.io/router.tls: "true"
  name: bifrost-ingress
spec:
  rules:
    - host: bifrost.hogs.tswn.us
      http:
        paths:
          - backend:
              service:
                name: bifrost-svc
                port:
                  name: web
            path: /
            pathType: Prefix
