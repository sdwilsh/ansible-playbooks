---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/networkpolicy-allow-from-bifrost
  - ../../../components/networkpolicy-allow-from-traefik
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/networkpolicy-deny-all
  - ../../../components/pod-security-enforce-restricted
configMapGenerator:
  - name: unifi-network-mcp-configmap
    literals:
      # The library changes a bare hostname to "host:*".  This value can
      # match only a Host header that has a port.  Traefik does not add a
      # port for standard HTTPS traffic.  So the allowlist can never match
      # here.  Traefik already blocks unknown IP addresses, and the server
      # itself rejects any request with an Origin header.  This check adds
      # no extra protection.
      - UNIFI_MCP_ENABLE_DNS_REBINDING_PROTECTION=false
      - UNIFI_MCP_HTTP_ENABLED=true
      - UNIFI_NETWORK_HOST=unifi-network-application-svc.unifi.svc.cluster.local
      - UNIFI_NETWORK_PORT=443
      - UNIFI_NETWORK_SITE=default
      - UNIFI_NETWORK_VERIFY_SSL=false
      - UNIFI_POLICY_CREATE=false
      - UNIFI_POLICY_DELETE=false
      - UNIFI_POLICY_UPDATE=false
images:
  - name: ghcr.io/sirkirby/unifi-network-mcp
    newTag: 0.32.10@sha256:41a8dc6f40dae7eeb5b8292c8e422878e04a7a30874757e079f435affc5b962e
namespace: unifi-network-mcp
resources:
  - namespace.yml
  - deployment.yml
  - ingress.yml
  - networkpolicy/allow-egress-to-unifi.yml
  - service.yml
