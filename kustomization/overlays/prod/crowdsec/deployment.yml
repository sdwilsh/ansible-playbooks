---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crowdsec
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdsec
        hogs.tswn.us/internet-client: "true"
        hogs.tswn.us/loki-client: "true"
        hogs.tswn.us/prometheus-target: "true"
        hogs.tswn.us/traefik-route: "true"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - crowdsec
              topologyKey: kubernetes.io/hostname
      containers:
        - command:
            - sh
            - -c
            - /scripts/entrypoint.sh
          env:
            # The entrypoint registers a bouncer named `traefik` with this key.
            # Without it, only the bouncer of the current Traefik `Pod` holds the
            # key.
            - name: BOUNCER_KEY_traefik
              valueFrom:
                secretKeyRef:
                  key: traefik-bouncer_api_key
                  name: crowdsec-credentials-secret
            - name: COLLECTIONS
              value: >-
                crowdsecurity/iptables
                crowdsecurity/traefik
                gauth-fr/immich
                LePresidente/authelia
                LePresidente/jellyfin
                sdwilsh/navidrome
            - name: CROWDSEC_BYPASS_DB_VOLUME_CHECK
              value: "1"
            # The entrypoint registers the local agent as a machine with this
            # name, and it takes `localhost` when the name is absent.  Two
            # `Pod`s then use one machine: the second `Pod` deletes the machine
            # and makes it again with a new password, which stops the first
            # `Pod`.  The name of the `Pod` gives each one its own machine.
            - name: CUSTOM_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: crowdsec-pg-cluster-app
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: crowdsec-pg-cluster-app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: crowdsec-pg-cluster-app
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  key: username
                  name: crowdsec-pg-cluster-app
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  key: registration_token
                  name: crowdsec-credentials-secret
            - name: TZ
              value: America/Los_Angeles
          image: ghcr.io/crowdsecurity/crowdsec
          name: crowdsec
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /metrics
              port: metrics
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          ports:
            - name: api
              containerPort: 3000
            - name: metrics
              containerPort: 6060
          readinessProbe:
            failureThreshold: 3
            exec:
              command:
                - cscli
                - decisions
                - list
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /metrics
              port: metrics
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          volumeMounts:
            - name: crowdsec-acquisitions-config
              mountPath: /staging/etc/crowdsec/acquis.d/
              readOnly: true
            - name: crowdsec-config
              mountPath: /etc/crowdsec/config.yaml.local
              readOnly: true
              subPath: config.yaml.local
            - name: crowdsec-credentials-config
              mountPath: /secrets/online_api_credentials.yaml
              readOnly: true
              subPath: online_api_credentials.yaml
            # The name sorts first, so this parser runs before the other
            # parsers in s02-enrich.
            - name: crowdsec-parsers-config
              mountPath: /etc/crowdsec/parsers/s02-enrich/00-traefik-cf-connecting-ip.yaml
              readOnly: true
              subPath: traefik-cf-connecting-ip.yaml
            - name: crowdsec-scripts
              mountPath: /scripts
              readOnly: true
      enableServiceLinks: false
      hostUsers: false
      initContainers:
        - command:
            - sh
            - -c
            - until pg_isready; do echo "waiting for database ${PGHOST}:${PGPORT}/${PGDATABASE}..."; sleep 10; done;
          env:
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: crowdsec-pg-cluster-app
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: crowdsec-pg-cluster-app
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: crowdsec-pg-cluster-app
            - name: PGSSLMODE
              value: require
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: crowdsec-pg-cluster-app
          image: postgres
          name: wait-for-crowdsec-pg-is-ready
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
      priorityClassName: system-cluster-critical
      volumes:
        - configMap:
            name: crowdsec-acquisitions-configmap
          name: crowdsec-acquisitions-config
        - configMap:
            name: crowdsec-configmap
          name: crowdsec-config
        - name: crowdsec-credentials-config
          secret:
            secretName: crowdsec-credentials-secret
        - configMap:
            name: crowdsec-parsers-configmap
          name: crowdsec-parsers-config
        - configMap:
            defaultMode: 0777
            name: crowdsec-scripts-configmap
          name: crowdsec-scripts
