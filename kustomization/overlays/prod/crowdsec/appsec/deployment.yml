---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-appsec-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: crowdsec-appsec
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdsec-appsec
        hogs.tswn.us/internet-client: "true"
        hogs.tswn.us/prometheus-target: "true"
        hogs.tswn.us/traefik-route: "true"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - crowdsec-appsec
              topologyKey: kubernetes.io/hostname
      containers:
        - command:
            - sh
            - -c
            - /scripts/appsec-entrypoint.sh
          env:
            - name: COLLECTIONS
              value: crowdsecurity/appsec-virtual-patching
            - name: CROWDSEC_BYPASS_DB_VOLUME_CHECK
              value: "1"
            - name: CUSTOM_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DISABLE_LOCAL_API
              value: "true"
            - name: DISABLE_ONLINE_API
              value: "true"
            - name: LOCAL_API_URL
              value: http://crowdsec-svc.crowdsec.svc.cluster.local:3000
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  key: registration_token
                  name: crowdsec-credentials-secret
            - name: TZ
              value: America/Los_Angeles
          image: ghcr.io/crowdsecurity/crowdsec
          name: crowdsec
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /metrics
              port: metrics
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          ports:
            - name: appsec
              containerPort: 7422
            - name: metrics
              containerPort: 6060
          # The probe must not use the local API.  When the local API stops,
          # the AppSec component continues to examine requests.
          readinessProbe:
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: appsec
            timeoutSeconds: 5
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /metrics
              port: metrics
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          volumeMounts:
            - name: crowdsec-appsec-acquisitions-config
              mountPath: /staging/etc/crowdsec/acquis.d/
              readOnly: true
            - name: crowdsec-appsec-config
              mountPath: /etc/crowdsec/config.yaml.local
              readOnly: true
              subPath: config.yaml.local
            - name: crowdsec-scripts
              mountPath: /scripts
              readOnly: true
      enableServiceLinks: false
      hostUsers: false
      priorityClassName: system-cluster-critical
      volumes:
        - configMap:
            name: crowdsec-appsec-acquisitions-configmap
          name: crowdsec-appsec-acquisitions-config
        - configMap:
            name: crowdsec-appsec-configmap
          name: crowdsec-appsec-config
        - configMap:
            defaultMode: 0777
            name: crowdsec-scripts-configmap
          name: crowdsec-scripts
