---
# One Hive dashboard load makes about 45 requests in three seconds.  The
# http-crawl-non_statics scenario counts them as a crawl and bans the signed-in
# user.
description: Skip events for the Hive dashboards
filter: >-
  evt.Meta.service == 'http' &&
  evt.Meta.log_type == 'http_access-log'
name: sdwilsh/hive-whitelist
whitelist:
  expression:
    - evt.Meta.target_fqdn in ['hive.tswn.us', 'marinatedconcrete-hive.tswn.us']
  reason: Hive dashboard page loads
