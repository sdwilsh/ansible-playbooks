---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: crowdsec-podmonitor
spec:
  podMetricsEndpoints:
    # crowdsec
    - path: /metrics
      port: metrics
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - crowdsec
          - crowdsec-appsec
