---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/networkpolicy-allow-from-bifrost
  - ../../../components/networkpolicy-allow-to-api-server
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/networkpolicy-allow-to-olah
  - ../../../components/networkpolicy-deny-all
  - ../../../components/pod-security-enforce-restricted
configMapGenerator:
  - name: local-llm-scripts-configmap
    files:
      - configmap/fetch-model.sh
  - name: local-llm-smoke-test-scripts-configmap
    files:
      - configmap/smoke-test.sh
images:
  - name: docker.io/curlimages/curl
    newTag: 8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
  - name: ghcr.io/sdwilsh/sif
    newTag: latest@sha256:be7d82034650edab3abf3820ec033b33fc38af7954c64a3ac98fc35560a3a2ba
namespace: local-llm
patches:
  - path: patches/keep_smoke_test_label.yml
    target:
      kind: Job
  - path: patches/smoke_test_hook.yml
    target:
      kind: Job
resources:
  - namespace.yml
  - networkpolicy/allow-from-frigate.yml
  - networkpolicy/allow-smoke-test.yml
  - rbac/smoke-test.yml
  - ./group-a
  - ./group-b
