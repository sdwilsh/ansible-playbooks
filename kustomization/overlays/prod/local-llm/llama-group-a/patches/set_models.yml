---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: this-is-ignored-but-is-required
spec:
  template:
    spec:
      containers:
        - name: llama-server
          env: &models
            - name: MODELS
              valueFrom:
                configMapKeyRef:
                  key: MODELS
                  name: local-llm-models-configmap
          # Two servers hold 4311 MiB at their highest, of which the aux
          # model holds 2532 MiB.
          resources:
            limits:
              memory: 8Gi
          # check-servers.sh asks two servers in sequence.  The rule is
          # timeoutSeconds >= 4 * N + 2, periodSeconds >= timeoutSeconds + 5.
          startupProbe:
            timeoutSeconds: 10
          readinessProbe:
            periodSeconds: 15
            timeoutSeconds: 10
      initContainers:
        - name: fetch-model
          env: *models
