---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: this-is-ignored-but-is-required
spec:
  template:
    spec:
      containers:
        - name: llama-server
          env:
            - name: LLAMA_ARG_CACHE_RAM
              value: "4096"
            - &models
              name: MODELS
              valueFrom:
                configMapKeyRef:
                  key: MODELS
                  name: local-llm-models-configmap
          # Two servers hold 4311 MiB at their highest.  The two prompt
          # caches above add 8192 MiB.
          resources:
            limits:
              memory: 12Gi
          # check-servers.sh asks two servers in sequence.  The rule is
          # timeoutSeconds >= 4 * N + 2, periodSeconds >= timeoutSeconds + 5.
          startupProbe:
            timeoutSeconds: 10
          readinessProbe:
            periodSeconds: 15
            timeoutSeconds: 10
      initContainers:
        - name: fetch-model
          env:
            - *models
