---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-llm-model-cache-pvc
spec:
  resources:
    requests:
      # The files in `models.txt` total 37.04 GiB.  64Gi keeps 26.96 GiB free.
      storage: 64Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-llm-disk-cache-pvc
spec:
  resources:
    requests:
      storage: 72Gi
