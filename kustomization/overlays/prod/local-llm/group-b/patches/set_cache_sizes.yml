---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-llm-model-cache-pvc
spec:
  resources:
    requests:
      # The files in `models.txt` total 53.93 GiB.  64Gi keeps 10.07 GiB free.
      storage: 64Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-llm-disk-cache-pvc
spec:
  resources:
    requests:
      storage: 72Gi
