---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: this-is-ignored-but-is-required
spec:
  template:
    spec:
      containers:
        - name: llama-server
          env:
            - &models
              name: MODELS
              valueFrom:
                configMapKeyRef:
                  key: MODELS
                  name: local-llm-models-configmap
          # check-servers.sh asks three servers in sequence.  The rule is
          # timeoutSeconds >= 4 * N + 2, periodSeconds >= timeoutSeconds + 5.
          readinessProbe:
            periodSeconds: 19
            timeoutSeconds: 14
          # Three servers share this limit.  The weights are in GTT, so the
          # container holds the 6 GiB Q8 RAM cache and the file cache.  The
          # request fits the 33.07 GiB of allocatable memory.
          resources:
            limits:
              memory: 24Gi
            requests:
              memory: 20Gi
          startupProbe:
            failureThreshold: 240
            periodSeconds: 19
            timeoutSeconds: 14
      initContainers:
        - name: fetch-model
          env:
            - *models
