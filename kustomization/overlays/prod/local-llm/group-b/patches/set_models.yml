---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: this-is-ignored-but-is-required
spec:
  template:
    spec:
      containers:
        - name: llama-server
          env:
            - &models
              name: MODELS
              valueFrom:
                configMapKeyRef:
                  key: MODELS
                  name: local-llm-models-configmap
            # The GPU maps 8 compute queues for all processes together.  Each
            # server holds 2 queues at a cap of 1, so the 4 servers fit.
            - name: GPU_MAX_HW_QUEUES
              value: "1"
          # check-servers.sh asks four servers in sequence.  The rule is
          # timeoutSeconds >= 4 * N + 2, periodSeconds >= timeoutSeconds + 5.
          readinessProbe:
            periodSeconds: 23
            timeoutSeconds: 18
          # Four servers share this limit.  The weights are in GTT, so the
          # container holds the 6 GiB Q8 RAM cache and the file cache.  The
          # request fits the 29.07 GiB of allocatable memory.
          resources:
            limits:
              memory: 24Gi
            requests:
              memory: 20Gi
          startupProbe:
            failureThreshold: 240
            periodSeconds: 23
            timeoutSeconds: 18
      initContainers:
        - name: fetch-model
          env:
            - *models
