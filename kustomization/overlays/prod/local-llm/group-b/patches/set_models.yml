---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: this-is-ignored-but-is-required
spec:
  template:
    spec:
      containers:
        - name: llama-server
          env:
            - &models
              name: MODELS
              valueFrom:
                configMapKeyRef:
                  key: MODELS
                  name: local-llm-models-configmap
            # The GPU maps 8 compute queues for all processes together.  Each
            # server holds 2 queues at a cap of 1, so at most 4 servers fit.
            - name: GPU_MAX_HW_QUEUES
              value: "1"
          # check-servers.sh asks each server in sequence, for at most 4 seconds
          # each.  The rule is timeoutSeconds >= 4 * N + 2,
          # periodSeconds >= timeoutSeconds + 5.
          readinessProbe:
            periodSeconds: 23
            timeoutSeconds: 18
          # The weights are in GTT, so the container holds the 6 GiB RAM
          # caches of Q8 and of Inkling, and the file cache.
          # `host_vars/gpuworker02.hogs.tswn.us.yml` holds the memory budget.
          resources:
            limits:
              memory: 24Gi
            requests:
              memory: 20Gi
          startupProbe:
            failureThreshold: 240
            periodSeconds: 23
            timeoutSeconds: 18
      initContainers:
        - name: fetch-model
          env:
            - *models
