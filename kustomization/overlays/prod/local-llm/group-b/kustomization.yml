---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../base
  - ../smoke-test
configMapGenerator:
  - name: local-llm-models-configmap
    files:
      - MODELS=configmap/models.txt
# Group A selects `local-llm`.  Group B selects `local-llm-group-b` to keep
# the groups apart.
labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: local-llm-group-b
namePrefix: group-b-
patches:
  - path: patches/set_cache_sizes.yml
  - path: patches/set_progress_deadline.yml
  - path: patches/add_ports.yml
    target:
      kind: Deployment
      name: local-llm-deployment
  - path: patches/pin_node.yml
    target:
      kind: Deployment
      name: local-llm-deployment
  - path: patches/set_models.yml
    target:
      kind: Deployment
      name: local-llm-deployment
  - path: patches/serve_additional_models.yml
    target:
      kind: Service
      name: local-llm-svc
replacements:
  - source:
      kind: Rollout
      name: group-b-local-llm-rollout
    targets:
      - fieldPaths:
          - spec.metrics.[name=smoke-test].provider.job.spec.template.spec.containers.[name=smoke-test].env.[name=ROLLOUT].value
        select:
          kind: AnalysisTemplate
  - source:
      kind: Service
      name: group-b-local-llm-svc
    targets:
      - fieldPaths:
          - spec.metrics.[name=smoke-test].provider.job.spec.template.spec.containers.[name=smoke-test].env.[name=SERVICE].value
        select:
          kind: AnalysisTemplate
