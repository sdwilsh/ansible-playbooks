---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: local-llm-statefulset
spec:
  replicas: 1
  serviceName: local-llm-svc
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: local-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-llm
        hogs.tswn.us/bifrost-route: "true"
        hogs.tswn.us/olah-client: "true"
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: hardware.hogs.tswn.us/gpu
                    operator: In
                    values:
                      - strixhalo
      tolerations:
        - effect: NoSchedule
          key: gpu
          operator: Equal
          value: strixhalo
      initContainers:
        - name: fetch-model
          image: docker.io/curlimages/curl
          command:
            - sh
            - /scripts/fetch-model.sh
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /models
              name: model-cache
            - mountPath: /scripts
              name: local-llm-scripts
              readOnly: true
      containers:
        - name: llama-server
          # The image holds the arguments of each server.  A container takes
          # `MODELS`, `POD_IP`, a writable `/run` and the models on `/models`.
          image: ghcr.io/sdwilsh/sif
          env:
            # `MODELS` is required to be set via a patch in each component!
            # A record is `alias|base URL|shard names|port|context size`, and
            # `fetch-model.sh` gets the shards from the same base URL.  GTT,
            # not host memory, bounds context; see
            # `group_vars/kairos_gpuworker.yml`.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            # Each model is hosted on a port defined in `MODELS` above.
            - containerPort: 8080
              name: model-api
          volumeMounts:
            - mountPath: /models
              name: model-cache
            - mountPath: /run
              name: run
            - mountPath: /tmp
              name: tmp
          startupProbe:
            exec:
              command:
                - /usr/local/bin/check-servers.sh
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 80
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/check-servers.sh
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            # s6 will restart a dead server, so just check the s6 supervisor.
            exec:
              command:
                - /usr/local/bin/check-supervisor.sh
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            limits:
              amd.com/gpu: 1
              cpu: 8000m
              # This limit and the GTT limit are one budget.  Read
              # `group_vars/kairos_gpuworker.yml` before you change it.
              memory: 10Gi
            requests:
              amd.com/gpu: 1
              cpu: 2000m
              # A low request raises this pod's OOM-kill priority under node memory pressure.
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - configMap:
            name: local-llm-scripts-configmap
          name: local-llm-scripts
        - emptyDir:
            medium: Memory
            sizeLimit: 16Mi
          name: run
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: model-cache
        labels:
          recurring-job.longhorn.io/source: enabled
          recurring-job-group.longhorn.io/default: disabled
          # olah can always rebuild this cache; a backup of it wastes
          # backup storage.
          recurring-job-group.longhorn.io/no-backup: enabled
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi
        storageClassName: longhorn-ephemeral
