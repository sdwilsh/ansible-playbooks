---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-frigate-networkpolicy
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homeassistant
          podSelector:
            matchLabels:
              app.kubernetes.io/name: frigate
      ports:
        - port: model-api4
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: local-llm-group-b
  policyTypes:
    - Ingress
