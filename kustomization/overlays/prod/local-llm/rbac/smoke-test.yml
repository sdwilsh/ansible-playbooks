---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-llm-smoke-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: local-llm-smoke-test-role
rules:
  - apiGroups:
      - argoproj.io
    resourceNames:
      - group-a-local-llm-rollout
      - group-b-local-llm-rollout
    resources:
      - rollouts/scale
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: local-llm-smoke-test-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: local-llm-smoke-test-role
subjects:
  - kind: ServiceAccount
    name: local-llm-smoke-test
