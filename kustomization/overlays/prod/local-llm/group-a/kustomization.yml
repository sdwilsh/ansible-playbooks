---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../base
  - ../smoke-test
configMapGenerator:
  - name: local-llm-models-configmap
    files:
      - MODELS=configmap/models.txt
namePrefix: group-a-
patches:
  - path: patches/pin_node.yml
    target:
      kind: StatefulSet
      name: local-llm-statefulset
  - path: patches/set_models.yml
    target:
      kind: StatefulSet
      name: local-llm-statefulset
replacements:
  - source:
      kind: StatefulSet
      name: group-a-local-llm-statefulset
    targets:
      - fieldPaths:
          - spec.template.spec.containers.[name=smoke-test].env.[name=STATEFULSET].value
        select:
          kind: Job
  - source:
      kind: Service
      name: group-a-local-llm-svc
    targets:
      - fieldPaths:
          - spec.template.spec.containers.[name=smoke-test].env.[name=SERVICE].value
        select:
          kind: Job
