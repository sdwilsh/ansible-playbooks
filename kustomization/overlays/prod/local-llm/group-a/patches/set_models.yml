---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: this-is-ignored-but-is-required
spec:
  template:
    spec:
      containers:
        - name: llama-server
          env:
            - &models
              name: MODELS
              valueFrom:
                configMapKeyRef:
                  key: MODELS
                  name: local-llm-models-configmap
          # check-servers.sh asks one server.  The rule is
          # timeoutSeconds >= 4 * N + 2, periodSeconds >= timeoutSeconds + 5.
          readinessProbe:
            periodSeconds: 11
            timeoutSeconds: 6
          # `host_vars/gpuworker01.hogs.tswn.us.yml` holds the memory budget
          # for this limit.  Change them together.
          resources:
            limits:
              memory: 93Gi
            requests:
              memory: 89Gi
          startupProbe:
            failureThreshold: 240
            periodSeconds: 15
            timeoutSeconds: 6
      initContainers:
        - name: fetch-model
          env:
            - *models
