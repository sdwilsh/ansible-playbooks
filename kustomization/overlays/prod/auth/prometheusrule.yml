---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: auth-rules
spec:
  groups:
    - name: auth
      interval: 1m
      rules:
        - alert: authelia-down
          annotations:
            description: "Authelia has no available replica for more than 2 minutes, or its metric is missing.  Cluster login is down."
          expr: sum(kube_deployment_status_replicas_available{deployment="authelia-deployment",exported_namespace="auth"}) == 0 or absent(kube_deployment_status_replicas_available{deployment="authelia-deployment",exported_namespace="auth"})
          for: 2m
          labels:
            severity: page
        - alert: authelia-redis-not-ready
          annotations:
            description: "Fewer Authelia Redis pods are ready than the StatefulSet wants for more than 5 minutes, or the metric is missing.  Sessions can fail."
          expr: kube_statefulset_status_replicas_ready{exported_namespace="auth",statefulset="authelia-redis-replication"} < kube_statefulset_replicas{exported_namespace="auth",statefulset="authelia-redis-replication"} or absent(kube_statefulset_status_replicas_ready{exported_namespace="auth",statefulset="authelia-redis-replication"})
          for: 5m
          labels:
            severity: warning
