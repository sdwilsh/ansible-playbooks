---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/authelia
  - ../../../components/cnpg-backup
  - ../../../components/lldap
  - ../../../components/networkpolicy-allow-from-cnpg-operator
  - ../../../components/networkpolicy-allow-from-prometheus
  - ../../../components/networkpolicy-allow-from-prometheus-to-cnpg-cluster
  - ../../../components/networkpolicy-allow-from-traefik
  - ../../../components/networkpolicy-allow-to-api-server
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/networkpolicy-allow-to-proton-bridge
  - ../../../components/networkpolicy-allow-within-this-namespace
  - ../../../components/networkpolicy-deny-all
  - ../../../components/pod-security-enforce-restricted
configMapGenerator:
  - name: authelia-configmap
    files:
      - configmap/authelia/config.yml
images:
  - name: docker.io/bitnami/kubectl
    newTag: latest@sha256:ab90e1058e5a658cc94b4e7eb6d48e5758cfd6d77b5dd1869513aec3a3054673
  - name: postgres
    newTag: 18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
  - name: quay.io/opstree/redis-sentinel
    newTag: v8.10.1@sha256:99c6953e947b8e958198b6670d44800f388240a5e1939414be39a74c05953c0e
  - name: quay.io/opstree/redis
    newTag: v8.10.1@sha256:d3ef5a7f11eb501034b6612b842c864e1946088c52c04b29a22f38b1fe37c99b
namespace: auth
patches:
  # authelia
  - path: patches/authelia/add_config.yml
    target:
      kind: Deployment
      name: authelia-deployment
  - path: patches/authelia/add_proton_bridge_client_label.yml
    target:
      kind: Deployment
      name: authelia-deployment
  # cnpg
  - path: patches/cnpg/set_backup_path.yml
    target:
      kind: ObjectStore
      name: garage-objectstore
  # lldap
  - path: patches/lldap/add_config.yml
    target:
      kind: Deployment
      name: lldap-deployment
  - path: patches/lldap/add_ldaps_for_deployment.yml
    target:
      kind: Deployment
      name: lldap-deployment
  - path: patches/lldap/add_ldaps_for_service.yml
    target:
      kind: Service
      name: lldap-svc
  - path: patches/lldap/add_postgres.yml
    target:
      kind: Deployment
      name: lldap-deployment
  - path: patches/lldap/add_proton_bridge_client_label.yml
    target:
      kind: Deployment
      name: lldap-deployment
  - path: patches/lldap/add_smtp.yml
    target:
      kind: Deployment
      name: lldap-deployment
  - path: patches/add_traefik_route_label.yml
    target:
      kind: Deployment
      name: authelia-deployment
  - path: patches/add_traefik_route_label.yml
    target:
      kind: Deployment
      name: lldap-deployment
  - path: patches/authelia/add_prometheus_target_label.yml
    target:
      kind: Deployment
      name: authelia-deployment
  - path: patches/set_prometheus_networkpolicy_ports.yml
    target:
      kind: NetworkPolicy
      name: allow-from-prometheus-networkpolicy
resources:
  - namespace.yml
  - certificate/lldap.yml
  - cnpg/backup/authelia.yml
  - cnpg/backup/lldap.yml
  - cnpg/cluster/authelia.yml
  - cnpg/cluster/lldap.yml
  - cnpg/podmonitor/authelia.yml
  - cnpg/podmonitor/lldap.yml
  - cnpg/scheduledbackup/authelia.yml
  - cnpg/scheduledbackup/lldap.yml
  - ingress/authelia.yml
  - ingress/lldap.yml
  - middleware/forwardauth.yml
  - networkpolicy/allow-to-and-from-redis-operator.yml
  - networkpolicy/allow-to-lldap-from-consumers.yml
  - redisreplication.yml
