---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kube-vip.io/loadbalancerIPs: 10.11.3.64
  name: traefik-choros-svc
spec:
  externalTrafficPolicy: Local
  loadBalancerClass: kube-vip.io/wireguard
  ports:
    - name: websecure-ext
      port: 8443
      protocol: TCP
      targetPort: websecure-ext
  selector:
    app.kubernetes.io/name: traefik
  type: LoadBalancer
