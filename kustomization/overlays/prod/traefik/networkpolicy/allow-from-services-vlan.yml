---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-services-vlan-networkpolicy
spec:
  ingress:
    # The nodes pull images from registries that Traefik serves.
    - from:
        - ipBlock:
            cidr: 10.11.0.101/32 # node01
        - ipBlock:
            cidr: 10.11.0.104/32 # worker01
        - ipBlock:
            cidr: 10.11.0.105/32 # worker02
        - ipBlock:
            cidr: 10.11.0.106/32 # worker03
        - ipBlock:
            cidr: 10.11.0.120/32 # gpuworker01
        - ipBlock:
            cidr: 10.11.0.121/32 # gpuworker02
      ports:
        - port: imapsecure
          protocol: TCP
        - port: mqtts
          protocol: TCP
        - port: smtpsecure
          protocol: TCP
        - port: web
          protocol: TCP
        - port: websecure
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
