---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-home-networkpolicy
spec:
  ingress:
    - from:
        - ipBlock:
            cidr: 10.117.0.0/23 # HOME
        - ipBlock:
            cidr: 10.117.2.0/24 # Home, the remote-user VPN
      ports:
        - port: imapsecure
          protocol: TCP
        - port: mqtts
          protocol: TCP
        - port: smtpsecure
          protocol: TCP
        - port: web
          protocol: TCP
        - port: websecure
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
