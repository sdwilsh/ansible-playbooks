---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/traefik
  - ../../../components/networkpolicy-allow-from-prometheus
  - ../../../components/networkpolicy-allow-to-api-server
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/networkpolicy-allow-to-garage
  - ../../../components/networkpolicy-allow-to-internet
  - ../../../components/networkpolicy-allow-within-this-namespace
  - ../../../components/networkpolicy-deny-all
  - ../../../components/schedule-prefer-control-plane
configMapGenerator:
  - name: crowdsec-pages-configmap
    files:
      - configmap/crowdsec/pages/ban.html
  - name: traefik-cloudflarerealip-plugin
    files:
      - plugins/cloudflarerealip/.traefik.yml
      - plugins/cloudflarerealip/cloudflarerealip.go
      - plugins/cloudflarerealip/go.mod
  - name: traefik-config
    files:
      - configmap/traefik/dynamic.yml
      - configmap/traefik/static.yml
images:
  - name: traefik
    newName: 11notes/traefik
    newTag: 3.7.17@sha256:5fa3de90a94596d3bd11e95d6f2f3cd0c7254d61a11739c7332be81aa6ab66c8
namespace: traefik
patches:
  - path: patches/crowdsec/add_pages.yml
    target:
      kind: Deployment
      name: traefik-deployment
  - path: patches/traefik/add_configuration.yml
    target:
      kind: Deployment
      name: traefik-deployment
  - path: patches/traefik/add_networkpolicy_labels.yml
    target:
      kind: Deployment
      name: traefik-deployment
  - path: patches/traefik/update_subjects.yml
    target:
      kind: ClusterRoleBinding
      name: traefik-ingress-controller
resources:
  - namespace.yml
  - certificate.yml
  - ingress/traefik-dashboard.yml
  - networkpolicy/allow-from-cloudflare.yml
  - networkpolicy/allow-from-home-vlan.yml
  - networkpolicy/allow-from-man-vlan.yml
  - networkpolicy/allow-from-pods.yml
  - networkpolicy/allow-from-services-vlan.yml
  - networkpolicy/allow-from-workflow-jobs.yml
  - networkpolicy/allow-postgres-from-home-assistant.yml
  - networkpolicy/allow-to-external-backends.yml
  - networkpolicy/allow-to-routes.yml
  - podmonitor.yml
  - service/traefik-choros.yml
  - service/traefik-ci.yml
  - service/traefik.yml
