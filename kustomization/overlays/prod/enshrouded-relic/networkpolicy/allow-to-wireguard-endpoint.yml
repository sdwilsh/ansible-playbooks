---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-wireguard-endpoint-networkpolicy
spec:
  egress:
    - ports:
        - port: 51825
          protocol: UDP
      to:
        - ipBlock:
            cidr: 23.94.59.52/32
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enshrouded
  policyTypes:
    - Egress
