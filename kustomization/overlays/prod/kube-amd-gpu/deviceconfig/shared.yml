---
apiVersion: amd.com/v1alpha1
kind: DeviceConfig
metadata:
  name: shared
spec:
  devicePlugin:
    # No release tag exists past v1.31.0.10.  That release lacks the
    # fix for github.com/ROCm/k8s-device-plugin/issues/186.  The
    # `latest` tag includes the fix.  Pin its digest until a new
    # release ships.
    devicePluginImage: rocm/k8s-device-plugin:latest@sha256:979874ddf91f78fb750fd45d8a27d400d715b66d24aff90f77e51acb859b02fa
    enableDevicePlugin: true
    enableNodeLabeller: true
    # No release tag exists past v1.31.0.10.  That release lacks the
    # fix for github.com/ROCm/k8s-device-plugin/issues/186.  The
    # `labeller-latest` tag includes the fix.  Pin its digest until a
    # new release ships.
    nodeLabellerImage: rocm/k8s-device-plugin:labeller-latest@sha256:3c1593462cdd526fcd3f77eed162e0489f3d53bf9e484da1f0ce37fa7ff2dd34
  driver:
    # The OS image build already includes the `amdgpu` driver and
    # firmware.  The operator must not build or load the driver again.
    enable: false
  selector:
    # amdgpu-rules sets this label by PCI device ID, not by hostname.
    # The value is `shared` on any AMD GPU other than Strix Halo's
    # chip.  The value is `strixhalo` on that chip.  This keeps the
    # selector distinct from the strixhalo DeviceConfig's, on any
    # node.
    hardware.hogs.tswn.us/gpu: shared
