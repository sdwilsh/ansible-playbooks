---
apiVersion: amd.com/v1alpha1
kind: DeviceConfig
metadata:
  name: strixhalo
spec:
  devicePlugin:
    # No release tag exists past v1.31.0.10.  That release lacks the
    # fix for github.com/ROCm/k8s-device-plugin/issues/186.  The
    # `latest` tag includes the fix.  Pin its digest until a new
    # release ships.
    devicePluginImage: rocm/k8s-device-plugin:latest@sha256:2d40a4b541873cedc1d6abf6e42f6e7933fb8c6631dfb5009f6dbc902c6328e6
    # gpuworker01/gpuworker02 carry this taint.  Without it, the
    # device-plugin and node-labeller pods never schedule there.  The
    # operator then never advertises amd.com/gpu on these nodes.
    devicePluginTolerations:
      - effect: NoSchedule
        key: gpu
        operator: Equal
        value: strixhalo
    # No release tag exists past v1.31.0.10.  That release lacks the
    # fix for github.com/ROCm/k8s-device-plugin/issues/186.  The
    # `labeller-latest` tag includes the fix.  Pin its digest until a
    # new release ships.
    nodeLabellerImage: rocm/k8s-device-plugin:labeller-latest@sha256:6a01e23699fc43587ba511f7b8a5bf694a5f57acec48262dad0a8f2d953c708e
    nodeLabellerTolerations:
      - effect: NoSchedule
        key: gpu
        operator: Equal
        value: strixhalo
  driver:
    # The OS image build already includes the `amdgpu` driver and
    # firmware.  The operator must not build or load the driver again.
    enable: false
  metricsExporter:
    enable: true
    prometheus:
      serviceMonitor:
        enable: true
        interval: 15s
        metricRelabelings:
          - action: labeldrop
            regex: (container|namespace|pod)
        relabelings:
          - action: replace
            sourceLabels:
              - __meta_kubernetes_pod_node_name
            targetLabel: node
    resource:
      limits:
        # This limit is intentionally tight.  This monitoring should not
        # cause memory pressure to occur!
        # See `group_vars/kairos_gpuworker.yml`.
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 96Mi
    tolerations:
      - effect: NoSchedule
        key: gpu
        operator: Equal
        value: strixhalo
  selector:
    hardware.hogs.tswn.us/gpu: strixhalo
