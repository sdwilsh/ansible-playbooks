---
apiVersion: amd.com/v1alpha1
kind: DeviceConfig
metadata:
  name: strixhalo
spec:
  devicePlugin:
    # No release tag exists past v1.31.0.10.  That release lacks the
    # fix for github.com/ROCm/k8s-device-plugin/issues/186.  The
    # `latest` tag includes the fix.  Pin its digest until a new
    # release ships.
    devicePluginImage: rocm/k8s-device-plugin:latest@sha256:979874ddf91f78fb750fd45d8a27d400d715b66d24aff90f77e51acb859b02fa
    # gpuworker01/gpuworker02 carry this taint.  Without it, the
    # device-plugin and node-labeller pods never schedule there.  The
    # operator then never advertises amd.com/gpu on these nodes.
    devicePluginTolerations:
      - effect: NoSchedule
        key: gpu
        operator: Equal
        value: strixhalo
    # No release tag exists past v1.31.0.10.  That release lacks the
    # fix for github.com/ROCm/k8s-device-plugin/issues/186.  The
    # `labeller-latest` tag includes the fix.  Pin its digest until a
    # new release ships.
    nodeLabellerImage: rocm/k8s-device-plugin:labeller-latest@sha256:f27ec9e1496eea0571b4b54591147d38bd0d15a5d1236c47f7e7b739842c4bd7
    nodeLabellerTolerations:
      - effect: NoSchedule
        key: gpu
        operator: Equal
        value: strixhalo
  driver:
    # The OS image build already includes the `amdgpu` driver and
    # firmware.  The operator must not build or load the driver again.
    enable: false
  selector:
    hardware.hogs.tswn.us/gpu: strixhalo
