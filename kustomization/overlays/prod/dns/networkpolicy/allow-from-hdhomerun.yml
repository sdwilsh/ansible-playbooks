---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-hdhomerun-networkpolicy
spec:
  ingress:
    - from:
        - ipBlock:
            cidr: 10.11.0.200/32 # hdhomerun01, on SERVICES
      ports:
        - port: dns-tcp
          protocol: TCP
        - port: dns-udp
          protocol: UDP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: blocky
  policyTypes:
    - Ingress
