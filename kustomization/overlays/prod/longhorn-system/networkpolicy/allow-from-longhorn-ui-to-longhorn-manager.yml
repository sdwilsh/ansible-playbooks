---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-longhorn-ui-to-longhorn-manager-networkpolicy
spec:
  egress:
    - ports:
        - port: manager
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app: longhorn-manager
  podSelector:
    matchLabels:
      app: longhorn-ui
  policyTypes:
    - Egress
