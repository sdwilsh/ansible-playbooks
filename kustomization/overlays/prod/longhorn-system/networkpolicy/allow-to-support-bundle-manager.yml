---
# The manager and the support bundle agents send to this port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-support-bundle-manager-networkpolicy
spec:
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app: support-bundle-manager
  policyTypes:
    - Ingress
