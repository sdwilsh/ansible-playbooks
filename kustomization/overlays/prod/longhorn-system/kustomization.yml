---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/longhorn
  - ../../../components/networkpolicy-allow-from-traefik
  - ../../../components/networkpolicy-allow-to-api-server
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/pod-security-enforce-privileged
patches:
  - path: patches/add_traefik_route_label_to_namespace.yml
  - path: patches/add_traefik_route_label_to_ui.yml
    target:
      kind: Deployment
      name: longhorn-ui
  - path: patches/keep_api_server_networkpolicy_wide.yml
    target:
      kind: NetworkPolicy
      name: allow-to-api-server-networkpolicy
  - path: patches/replace_traefik_port_with_http.yml
    target:
      kind: NetworkPolicy
      name: allow-from-traefik-networkpolicy
resources:
  - ingress.yml
  - networkpolicy/allow-to-backup-target.yml
  - networkpolicy/allow-to-this-namespace.yml
