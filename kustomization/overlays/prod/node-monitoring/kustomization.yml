---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/pod-security-enforce-privileged
configMapGenerator:
  - name: alloy-config
    files:
      - configmap/api-vip.alloy
      - configmap/journal.alloy
      - configmap/loki.alloy
      - configmap/networkpolicy.alloy
  - name: alloy-scripts-configmap
    files:
      - configmap/install_journald_conf.sh
      - configmap/logger_sidecar.py
helmCharts:
  - name: alloy
    version: 1.15.0
    repo: https://grafana.github.io/helm-charts
    releaseName: alloy
    valuesFile: alloy-values.yml
  - name: prometheus-node-exporter
    version: 5.2.0
    repo: https://prometheus-community.github.io/helm-charts
    releaseName: node-exporter
    valuesFile: node-exporter-values.yml
  - name: prometheus-smartctl-exporter
    version: 0.19.2
    repo: https://prometheus-community.github.io/helm-charts
    releaseName: smartctl-exporter
    valuesFile: smartctl-exporter-values.yml
images:
  - name: docker.io/grafana/alloy
    newTag: v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
  - name: quay.io/prometheus-operator/prometheus-config-reloader
    newTag: v0.95.1@sha256:39bdbade0c64f7c38bb6d18d6f602b14ad489bc189b709dc9266b49e6647aac1
  - name: quay.io/prometheus/node-exporter
    newTag: v1.13.1@sha256:011e2d12c5bff759b90804bda642664775d7b4b127bf5148539bb82d3f590bb7
  - name: quay.io/prometheuscommunity/smartctl-exporter
    newTag: v0.15.0@sha256:a76e08dbf5db4781fefd1ed81c65ad46ae8d2849dae6b6d3acebcde2fc4e59d6
namespace: node-monitoring
resources:
  - namespace.yml
  - podmonitor.yml
  - rbac.yml
