---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: alloy-config
    files:
      - configmap/api-vip.alloy
      - configmap/journal.alloy
      - configmap/loki.alloy
      - configmap/networkpolicy.alloy
  - name: alloy-scripts-configmap
    files:
      - configmap/install_journald_conf.sh
      - configmap/logger_sidecar.py
helmCharts:
  - name: alloy
    version: 1.15.0
    repo: https://grafana.github.io/helm-charts
    releaseName: alloy
    valuesFile: alloy-values.yml
  - name: prometheus-node-exporter
    version: 4.60.1
    repo: https://prometheus-community.github.io/helm-charts
    releaseName: node-exporter
    valuesFile: node-exporter-values.yml
  - name: prometheus-smartctl-exporter
    version: 0.19.0
    repo: https://prometheus-community.github.io/helm-charts
    releaseName: smartctl-exporter
    valuesFile: smartctl-exporter-values.yml
images:
  - name: docker.io/grafana/alloy
    newTag: v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
  - name: quay.io/prometheus-operator/prometheus-config-reloader
    newTag: v0.94.2@sha256:a1897c67478bc23434534e91ad3855280771196b1daf17144db9dbcb655bef71
  - name: quay.io/prometheus/node-exporter
    newTag: v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
  - name: quay.io/prometheuscommunity/smartctl-exporter
    newTag: v0.15.0@sha256:a76e08dbf5db4781fefd1ed81c65ad46ae8d2849dae6b6d3acebcde2fc4e59d6
namespace: node-monitoring
resources:
  - namespace.yml
  - podmonitor.yml
  - rbac.yml
