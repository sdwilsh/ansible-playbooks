---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-unifi-network-mcp-networkpolicy
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: unifi-network-mcp
          podSelector:
            matchLabels:
              app.kubernetes.io/name: unifi-network-mcp
      ports:
        - port: una-web
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unifi-network-application
  policyTypes:
    - Ingress
