---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-unifi-syslog-networkpolicy
spec:
  egress:
    - ports:
        - port: syslog
          protocol: UDP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: unifi-syslog
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unifi-network-application
  policyTypes:
    - Egress
