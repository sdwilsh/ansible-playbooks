---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kube-vip.io/loadbalancerIPs: 10.11.3.65
  name: unifi-choros-svc
spec:
  externalTrafficPolicy: Local
  loadBalancerClass: kube-vip.io/wireguard
  ports:
    - name: device-api
      port: 8080
      protocol: TCP
      targetPort: 8080
    - name: device-stun
      port: 3478
      protocol: UDP
      targetPort: 3478
  selector:
    app.kubernetes.io/name: unifi-network-application
  type: LoadBalancer
