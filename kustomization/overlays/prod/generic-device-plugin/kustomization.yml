---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/generic-device-plugin
  - ../../../components/pod-security-enforce-privileged
namespace: generic-device-plugin
patches:
  - target:
      kind: DaemonSet
      name: generic-device-plugin
    path: patches/add_coraltpu.yml
  - target:
      kind: DaemonSet
      name: generic-device-plugin
    path: patches/add_npu.yml
  - target:
      kind: DaemonSet
      name: generic-device-plugin
    path: patches/add_quicksync.yml
  - target:
      kind: DaemonSet
      name: generic-device-plugin
    path: patches/add_render.yml
resources:
  - namespace.yml
