---
# The upstream base pins an older node-labeler image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: this-is-ignored-but-is-required
spec:
  template:
    spec:
      containers:
        - env:
            - name: NODE_LABELER_IMAGE
              value: quay.io/kairos/operator-node-labeler:v0.4.0@sha256:b53badbf5f5b21d63284abb842e32da1194ebc3fba0b5062cbf80b45a2f4d51e
          name: manager
