---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/networkpolicy-allow-to-api-server
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/networkpolicy-deny-all
  - ../../../components/pod-security-enforce-restricted
helmCharts:
  - includeCRDs: true
    name: hermes-agent-operator
    namespace: hermes-agent-operator
    releaseName: hermes-agent-operator
    repo: oci://ghcr.io/hermeum/charts
    valuesFile: values.yml
    version: 0.5.5
namespace: hermes-agent-operator
resources:
  - namespace.yml
