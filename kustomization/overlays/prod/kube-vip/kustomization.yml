---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - https://github.com/marinatedconcrete/config/kustomization/components/kube-vip?ref=kustomize-kube-vip@v5.1.0
  - https://github.com/marinatedconcrete/config/kustomization/components/kube-vip-wireguard?ref=kustomize-kube-vip-wireguard@v1.0.0
  - ../../../components/pod-security-enforce-privileged
namespace: kube-vip
patches:
  - path: patches/add_metrics_port.yml
    target:
      kind: DaemonSet
      name: kube-vip-svc-ds
  - path: patches/add_wireguard_metrics_port.yml
    target:
      kind: DaemonSet
      name: kube-vip-wg-ds
  - path: patches/set_egress_cidrs.yml
    target:
      kind: DaemonSet
      name: kube-vip-svc-ds
  - path: patches/set_vip_address.yml
    target:
      kind: DaemonSet
      name: kube-vip-ds
  - path: patches/tolerate_each_taint.yml
    target:
      kind: DaemonSet
      name: kube-vip-(svc|wg)-ds
resources:
  - namespace.yml
  - podmonitor.yml
  - prometheusrule.yml
