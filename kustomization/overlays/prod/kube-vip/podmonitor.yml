---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kube-vip-podmonitor
spec:
  podMetricsEndpoints:
    - path: /metrics
      port: metrics
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - kube-vip-svc-ds
          - kube-vip-wg-ds
