---
# A WireGuard `kube-vip` instance deletes each `kube_vip*` chain in the
# default nftables table when it starts.  A named instance keeps its egress
# SNAT rules in its own table, out of that reach.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: this-is-ignored-but-is-required
spec:
  template:
    spec:
      containers:
        - env:
            - name: instance_name
              value: arp
          name: kube-vip
