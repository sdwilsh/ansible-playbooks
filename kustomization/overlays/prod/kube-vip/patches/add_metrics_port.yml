---
# `kube-vip-svc-ds` serves the metrics on port 2113, but the container
# declares no port.  `kube-vip-podmonitor` selects the port by its name, and
# the operator makes a rule that keeps a target only when the pod declares that
# port.  Without this port, the rule drops each target, and Prometheus gets no
# metric from `kube-vip`.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: this-is-ignored-but-is-required
spec:
  template:
    spec:
      containers:
        - name: kube-vip
          ports:
            - containerPort: 2113
              name: metrics
              protocol: TCP
