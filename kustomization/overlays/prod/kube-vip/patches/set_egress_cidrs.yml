---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: this-is-ignored-but-is-required
spec:
  template:
    spec:
      containers:
        - env:
            - name: egress_podcidr
              value: 172.16.0.0/16
            - name: egress_servicecidr
              value: 172.17.0.0/16
          name: kube-vip
