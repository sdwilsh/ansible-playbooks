---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: this-is-ignored-but-is-required
spec:
  template:
    spec:
      # Only run on things than can handle AV1.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: hardware.hogs.tswn.us/gpu
                    operator: Exists
      containers:
        - name: jellyfin
          resources:
            limits:
              devic.es/render: 1
            requests:
              devic.es/render: 1
      tolerations:
        - effect: NoSchedule
          key: gpu
          operator: Equal
          value: strixhalo
