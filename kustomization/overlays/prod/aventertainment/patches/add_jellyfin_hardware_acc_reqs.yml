---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: this-is-ignored-but-is-required
spec:
  template:
    spec:
      # Only run on things than can handle AV1.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: hardware.hogs.tswn.us/gpu
                    operator: Exists
      containers:
        - name: jellyfin
          resources:
            limits:
              devic.es/render: 1
            requests:
              devic.es/render: 1
      securityContext:
        # The render node belongs to the `render` group on the host.  These
        # are the group IDs on Fedora, which each node runs.  The pod runs
        # as `nobody`, so it needs these groups if the render node does not
        # permit all users.
        supplementalGroups:
          - 39 # video
          - 105 # render
      tolerations:
        - effect: NoSchedule
          key: gpu
          operator: Equal
          value: strixhalo
