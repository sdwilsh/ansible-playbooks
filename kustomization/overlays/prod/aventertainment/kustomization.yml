      kind: Deployment
      name: tdarr-node-deployment
  - path: patches/add_tdarr_server_volumes.yml
    target:
      kind: StatefulSet
      name: tdarr-server-statefulset
  - path: patches/set_navidrome_baseurl.yml
    target:
      kind: StatefulSet
      name: navidrome-statefulset
  - path: patches/set_navidrome_disable_star_rating.yml
    target:
      kind: StatefulSet
      name: navidrome-statefulset
  - path: patches/set_navidrome_service_ip.yml
    target:
      kind: Service
      name: navidrome-svc
  - path: patches/set_jellyfin_service_ip.yml
    target:
      kind: Service
      name: jellyfin-svc
  - path: patches/add_traefik_networkpolicy_ports.yml
    target:
      kind: NetworkPolicy
      name: allow-from-traefik-networkpolicy
  - path: patches/add_traefik_route_label.yml
    target:
      kind: StatefulSet
      name: jellyfin-statefulset
  - path: patches/add_traefik_route_label.yml
    target:
      kind: StatefulSet
      name: navidrome-statefulset
  - path: patches/add_traefik_route_label.yml
    target:
      kind: StatefulSet
      name: tdarr-server-statefulset
  - path: patches/add_internet_client_label.yml
    target:
      kind: StatefulSet
      name: jellyfin-statefulset
  - path: patches/add_internet_client_label.yml
    target:
      kind: StatefulSet
      name: navidrome-statefulset
  - path: patches/add_internet_client_label.yml
    target:
      kind: StatefulSet
      name: tdarr-server-statefulset
  - path: patches/add_internet_client_label.yml
    target:
      kind: Deployment
      name: tdarr-node-deployment
resources:
  - namespace.yml
  - ingress.yml
  - networkpolicy/allow-tdarr-internal.yml
  - networkpolicy/allow-to-jellyfin-from-hfp.yml
  - persistentvolume.yml
  - persistentvolumeclaim.yml
