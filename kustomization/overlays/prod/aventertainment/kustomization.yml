---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/jellyfin
  - ../../../components/navidrome
  - ../../../components/networkpolicy-allow-from-traefik
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/networkpolicy-allow-to-internet
  - ../../../components/networkpolicy-allow-to-lldap
  - ../../../components/networkpolicy-deny-all
  - ../../../components/tdarr
images:
  - name: jellyfin/jellyfin
    newTag: 10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
  - name: deluan/navidrome
    newTag: 0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
namespace: aventertainment
patches:
  # Jellyfin
  - path: patches/jellyfin/add_hardware_acc_reqs.yml
    target:
      kind: StatefulSet
      name: jellyfin-statefulset
  - path: patches/jellyfin/add_lldap_client_label.yml
    target:
      kind: StatefulSet
      name: jellyfin-statefulset
  - path: patches/jellyfin/add_shader_cache_volume.yml
    target:
      kind: StatefulSet
      name: jellyfin-statefulset
  - path: patches/jellyfin/add_volumes.yml
    target:
      kind: StatefulSet
      name: jellyfin-statefulset
  - path: patches/jellyfin/set_service_ip.yml
    target:
      kind: Service
      name: jellyfin-svc
  - path: patches/add_traefik_route_label.yml
    target:
      kind: StatefulSet
      name: jellyfin-statefulset
  - path: patches/add_internet_client_label.yml
    target:
      kind: StatefulSet
      name: jellyfin-statefulset
  # Navidrome
  - path: patches/navidrome/add_traefik_networkpolicy_ports.yml
    target:
      kind: NetworkPolicy
      name: allow-from-traefik-networkpolicy
  - path: patches/navidrome/add_volumes.yml
    target:
      kind: StatefulSet
      name: navidrome-statefulset
  - path: patches/navidrome/set_baseurl.yml
    target:
      kind: StatefulSet
      name: navidrome-statefulset
  - path: patches/navidrome/set_disable_star_rating.yml
    target:
      kind: StatefulSet
      name: navidrome-statefulset
  - path: patches/navidrome/set_service_ip.yml
    target:
      kind: Service
      name: navidrome-svc
  - path: patches/navidrome/set_trusted_proxies.yml
    target:
      kind: StatefulSet
      name: navidrome-statefulset
  - path: patches/add_internet_client_label.yml
    target:
      kind: StatefulSet
      name: navidrome-statefulset
  - path: patches/add_traefik_route_label.yml
    target:
      kind: StatefulSet
      name: navidrome-statefulset
  # tdarr
  - path: patches/tdarr/add_node_volumes.yml
    target:
      kind: Deployment
      name: tdarr-node-deployment
  - path: patches/tdarr/add_server_volumes.yml
    target:
      kind: StatefulSet
      name: tdarr-server-statefulset
  - path: patches/add_internet_client_label.yml
    target:
      kind: StatefulSet
      name: tdarr-server-statefulset
  - path: patches/add_internet_client_label.yml
    target:
      kind: Deployment
      name: tdarr-node-deployment
  - path: patches/add_traefik_route_label.yml
    target:
      kind: StatefulSet
      name: tdarr-server-statefulset
resources:
  - namespace.yml
  - ingress.yml
  - networkpolicy/allow-tdarr-internal.yml
  - networkpolicy/allow-to-jellyfin-from-hfp.yml
  - persistentvolume.yml
  - persistentvolumeclaim.yml
