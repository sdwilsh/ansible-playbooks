---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-jellyfin-from-hfp-networkpolicy
spec:
  ingress:
    - from:
        - ipBlock:
            cidr: 10.11.2.31/32 # hogsflixplus01 (HFP remote node)
        - ipBlock:
            cidr: 10.11.2.32/32 # hogsflixplus02 (HFP remote node)
        - ipBlock:
            cidr: 10.11.2.33/32 # hogsflixplus03 (HFP remote node)
        - ipBlock:
            cidr: 10.11.2.34/32 # hogsflixplus04 (HFP remote node)
        - ipBlock:
            cidr: 10.11.2.35/32 # hogsflixplus05 (HFP remote node)
        - ipBlock:
            cidr: 10.11.2.36/32 # hogsflixplus06 (HFP remote node)
        - ipBlock:
            cidr: 10.11.2.37/32 # hogsflixplus07 (HFP remote node)
      ports:
        - port: discovery
          protocol: UDP
        # Not exposing ssdp!
        - port: web
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  policyTypes:
    - Ingress
