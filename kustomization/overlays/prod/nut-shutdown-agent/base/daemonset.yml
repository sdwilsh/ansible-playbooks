---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nut-shutdown-agent-daemonset
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nut-shutdown-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nut-shutdown-agent
        hogs.tswn.us/api-server-client: "true"
    spec:
      containers:
        - env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          image: ghcr.io/sdwilsh/nut-shutdown-agent
          livenessProbe:
            exec:
              command:
                - /healthy.sh
                - live
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          name: nut-shutdown-agent
          readinessProbe:
            exec:
              command:
                - /healthy.sh
                - ready
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            privileged: true
      hostPID: true
      priorityClassName: critical-application-infra
      serviceAccountName: nut-shutdown-agent
