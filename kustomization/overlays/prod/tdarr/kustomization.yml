---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/networkpolicy-allow-from-prometheus
  - ../../../components/networkpolicy-allow-from-traefik
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/networkpolicy-allow-to-internet
  - ../../../components/networkpolicy-allow-to-traefik
  - ../../../components/networkpolicy-deny-all
  - ../../../components/pod-security-enforce-baseline
  - ../../../components/tdarr
configMapGenerator:
  - files:
      - flows/sync-flows.js
      - flows/target-convert.json
      - flows/target-movies.json
      - flows/target-shows.json
    name: tdarr-flows
  - files:
      - flows/rerip-list.js
      - flows/target-convert.js
    name: tdarr-target-code
    options:
      disableNameSuffixHash: true
images:
  - name: docker.io/homeylab/tdarr-exporter
    newTag: 3.1.0@sha256:c72fd0ecf4aa5207d4f609d09fbb6470bac9e4dc5d9524303cd7169f5751bf62
namespace: tdarr
patches:
  - path: patches/add_target_code_volume.yml
    target:
      kind: Deployment
      name: tdarr-node-deployment
  - path: patches/add_node_volumes.yml
    target:
      kind: Deployment
      name: tdarr-node-deployment
  - path: patches/add_server_volumes.yml
    target:
      kind: StatefulSet
      name: tdarr-server-statefulset
  - path: patches/disable_auth.yml
    target:
      kind: StatefulSet
      name: tdarr-server-statefulset
  - path: patches/add_internet_client_label.yml
    target:
      kind: Deployment
      name: tdarr-node-deployment
  - path: patches/add_internet_client_label.yml
    target:
      kind: StatefulSet
      name: tdarr-server-statefulset
  - path: patches/add_traefik_route_label.yml
    target:
      kind: StatefulSet
      name: tdarr-server-statefulset
  - path: patches/set_server_sync_wave.yml
    target:
      kind: StatefulSet
      name: tdarr-server-statefulset
resources:
  - namespace.yml
  - cronjob.yml
  - exporter/deployment.yml
  - exporter/podmonitor.yml
  - exporter/prometheusrule.yml
  - ingress.yml
  - job.yml
  - networkpolicy/allow-from-disc-ripper.yml
  - networkpolicy/allow-tdarr-exporter.yml
  - networkpolicy/allow-tdarr-internal.yml
  - persistentvolume.yml
  - persistentvolumeclaim.yml
