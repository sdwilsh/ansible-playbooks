---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  name: tdarr-flows-sync-job
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tdarr-flows-sync
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      automountServiceAccountToken: false
      containers:
        - args:
            - /flows/sync-flows.js
          command:
            - node
          env:
            - name: TDARR_URL
              value: http://tdarr-svc:8265
          image: ghcr.io/haveagitgat/tdarr_node
          name: sync
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /flows
              name: flows
              readOnly: true
      priorityClassName: application
      restartPolicy: Never
      volumes:
        - configMap:
            name: tdarr-flows
          name: flows
