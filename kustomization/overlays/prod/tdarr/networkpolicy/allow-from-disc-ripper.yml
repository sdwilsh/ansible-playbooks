---
# disc-ripper reads the active jobs.  It skips a file that tdarr converts.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tdarr-server-from-disc-ripper-networkpolicy
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: disc-ripper
          podSelector:
            matchLabels:
              app.kubernetes.io/name: disc-ripper
      ports:
        - port: 8265
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tdarr-server
  policyTypes:
    - Ingress
