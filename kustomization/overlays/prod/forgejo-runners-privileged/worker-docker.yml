---
apiVersion: forgejo.tswn.us/v1alpha1
kind: Worker
metadata:
  labels:
    app.kubernetes.io/name: forgejo-runner-operator
  name: docker
spec:
  allowedJobContainerGroups:
    - end: 65535
      start: 0
  allowedJobContainerUsers:
    - end: 65535
      start: 0
  allowPrivilegedJobContainers: true
  fetchTimeout: 30s
  jobExecutor:
    image: job-executor:latest
  jobTimeout: 45m
  maxCapacity: 2
  minCapacity: 0
  podTemplate:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: NotIn
                    values:
                      - "true"
      automountServiceAccountToken: false
      containers:
        - env:
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2376
            - name: DOCKER_TLS_VERIFY
              value: "1"
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: "*"
          image: busybox
          name: workflow
          securityContext:
            allowPrivilegeEscalation: true
            privileged: true
          volumeMounts:
            - mountPath: /certs
              name: docker-certs
              readOnly: true
            - mountPath: /etc/containers/registries.conf
              name: containers-config
              readOnly: true
              subPath: registries.conf
            - mountPath: /etc/containers/storage.conf
              name: containers-config
              readOnly: true
              subPath: storage.conf
        - command:
            - sh
            - -c
            - /scripts/entrypoint.sh
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
            - name: XDG_CONFIG_HOME
              value: /etc
          image: docker.io/library/docker:29.6.2-dind-rootless@sha256:212a9e782c7119fd6a212beaab6b7665a29b663d894d0f6201710c89575ad0ae
          name: daemon
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 250m
              memory: 1Gi
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /certs
              name: docker-certs
            - mountPath: /etc/docker/daemon.json
              name: daemon-config
              readOnly: true
              subPath: daemon.json
            - mountPath: /mnt/scratch
              name: scratch
            - mountPath: /scripts/entrypoint.sh
              name: docker-entrypoint
              readOnly: true
              subPath: entrypoint.sh
      dnsConfig:
        nameservers:
          - 172.17.251.13
        options:
          - name: ndots
            value: "5"
        searches:
          - forgejo-runners-privileged.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      dnsPolicy: None
      priorityClassName: application-infra
      runtimeClassName: kata-qemu-runtime-rs
      securityContext:
        runAsGroup: 0
        runAsNonRoot: false
        runAsUser: 0
      serviceAccountName: forgejo-job
      volumes:
        - configMap:
            defaultMode: 0444
            name: containers-config-configmap
          name: containers-config
        - configMap:
            defaultMode: 0444
            name: daemon-config-configmap
          name: daemon-config
        - emptyDir: {}
          name: docker-certs
        - configMap:
            defaultMode: 0555
            name: docker-entrypoint-configmap
          name: docker-entrypoint
        - ephemeral:
            volumeClaimTemplate:
              metadata:
                labels:
                  # Use this PVC to configure attached PVs.
                  recurring-job.longhorn.io/source: enabled
                  # Opt into the no-backup group since it can easily be recreated.
                  recurring-job-group.longhorn.io/no-backup: enabled
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 50Gi
                storageClassName: longhorn-ephemeral-ssd
          name: scratch
