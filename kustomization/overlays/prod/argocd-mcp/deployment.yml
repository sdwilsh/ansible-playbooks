---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-mcp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-mcp
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - http
            - --allow-unauthenticated
            - --allowed-host-header
            - argocd-mcp.hogs.tswn.us
            - --bind-address
            - $(POD_IP)
          env:
            - name: ARGOCD_BASE_URL
              valueFrom:
                configMapKeyRef:
                  key: ARGOCD_BASE_URL
                  name: argocd-mcp-configmap
            - name: ARGOCD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  key: ARGOCD_API_TOKEN
                  name: argocd-mcp-secret
            - name: MCP_READ_ONLY
              value: "true"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          image: ghcr.io/argoproj-labs/mcp-for-argocd
          livenessProbe:
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: web
            timeoutSeconds: 5
          name: argocd-mcp
          ports:
            - containerPort: 3000
              name: web
          readinessProbe:
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: web
            timeoutSeconds: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
      enableServiceLinks: false
      priorityClassName: application-infra
