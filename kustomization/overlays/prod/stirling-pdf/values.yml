---

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # The entrypoint runs everything as this user when it does not start as
  # root.  This is stirlingpdfuser in the image.
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

envs:
  - name: APP_LOCALE
    value: en_US
  - name: SYSTEM_ENABLEANALYTICS
    value: "false"

ingress:
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  enabled: true
  hosts:
    - name: pdf-tools.hogs.tswn.us
      path: /

priorityClassName: application
