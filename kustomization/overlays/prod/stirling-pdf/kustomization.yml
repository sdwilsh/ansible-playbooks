---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/networkpolicy-allow-from-traefik
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/networkpolicy-deny-all
  - ../../../components/schedule-avoid-control-plane
helmCharts:
  - name: stirling-pdf-chart
    version: 2.2.0
    repo: https://docs.stirlingpdf.com/Stirling-PDF-chart/
    releaseName: stirling-pdf
    valuesFile: values.yml
images:
  - name: docker.stirlingpdf.com/stirlingtools/stirling-pdf
    newTag: 1.6.0-fat@sha256:6a98563e829ac87bc54e116ba0003f4a4379febc6745608132d48f4fb22b6c02
namespace: stirling-pdf
patches:
  - path: patches/add_traefik_route_label.yml
    target:
      kind: Deployment
      name: stirling-pdf-stirling-pdf-chart
  - path: patches/replace_traefik_port_with_http.yml
    target:
      kind: NetworkPolicy
      name: allow-from-traefik-networkpolicy
resources:
  - namespace.yml
