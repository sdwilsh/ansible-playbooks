---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: this-is-ignored-but-is-required
spec:
  template:
    spec:
      containers:
        - env:
            - name: DOCKER_MODS
              value: ghcr.io/sdwilsh/transmission-protonvpn:main
          name: transmission
          volumeMounts:
            - mountPath: /etc/resolv.conf
              name: protonvpn
              subPath: resolv.conf
      initContainers:
        - env:
            # Proton VPN client address is always 10.2.0.2.
            - name: WG_ADDRESS
              value: 10.2.0.2/32
            # The pod and service ranges of the cluster stay off the tunnel.
            - name: WG_EXCLUDE_CIDRS
              value: 172.16.0.0/16 172.17.0.0/16
          image: ghcr.io/sdwilsh/wireguard-egress
          name: setup-transmission
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
              drop:
                - ALL
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/wireguard
              name: wireguard-conf
      volumes:
        - name: protonvpn 
          configMap:
            name: protonvpn-configmap
        - name: wireguard-conf
          secret:
            items:
              - key: wg0
                path: wg0.conf
            secretName: transmission-secret
