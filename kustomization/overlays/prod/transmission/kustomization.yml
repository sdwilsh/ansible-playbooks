---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/networkpolicy-allow-from-traefik
  - ../../../components/networkpolicy-deny-all
  - ../../../components/transmission
  - ../../../components/schedule-avoid-control-plane
configMapGenerator:
  - name: protonvpn-configmap
    files:
      - configmap/protonvpn/resolv.conf
images:
  - name: ghcr.io/sdwilsh/wireguard-egress
    newTag: latest@sha256:169374cb385e3fb117dc8f64cc07f0df125e54d8399a282e498d9f73c9f3466b
  - name: lscr.io/linuxserver/transmission
    newTag: 4.0.5-r0-ls223@sha256:bd450da4a328cdf1f89845785150e79b531983b27ab6a1d4c2e3e7dcbf952bfc
namespace: transmission
patches:
  - path: patches/add_downloads_mount.yml
    target:
      kind: StatefulSet
      name: transmission-statefulset
  - path: patches/add_protonvpn.yml
    target:
      kind: StatefulSet
      name: transmission-statefulset
  - path: patches/add_traefik_route_label.yml
    target:
      kind: StatefulSet
      name: transmission-statefulset
  - path: patches/replace_traefik_port_with_http.yml
    target:
      kind: NetworkPolicy
      name: allow-from-traefik-networkpolicy
resources:
  - namespace.yml
  - ingress.yml
  - networkpolicy/allow-to-wireguard-endpoint.yml
  - persistentvolume.yml
  - persistentvolumeclaim.yml
