---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: forgejo-runner-dns

components:
  - ../../../components/coredns
  - ../../../components/networkpolicy-allow-coredns-to-internet
  - ../../../components/networkpolicy-deny-all
  - ../../../components/pod-security-enforce-restricted
configMapGenerator:
  - name: forgejo-runner-dns-configmap
    files:
      - configmap/coredns/Corefile
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-options: Prune=true
  labels:
    app.kubernetes.io/name: coredns
images:
  - name: docker.io/coredns/coredns
    newTag: 1.14.6@sha256:900f9c109f7a33545d3c811516e8376df9019147b750f5ce3e254468769176ea
patches:
  - path: patches/coredns/mount_configuration.yml
    target:
      kind: Deployment
      name: coredns-deployment
resources:
  - namespace.yml
