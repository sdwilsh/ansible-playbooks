---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: this-is-ignored-but-is-required
spec:
  template:
    spec:
      containers:
        - name: coredns
          volumeMounts:
            - mountPath: /config/
              name: prod-config
      volumes:
        - name: prod-config
          configMap:
            name: forgejo-runner-dns-configmap
