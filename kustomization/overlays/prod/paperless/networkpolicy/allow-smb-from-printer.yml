---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-smb-from-printer-networkpolicy
spec:
  ingress:
    - from:
        - ipBlock:
            cidr: 10.117.0.14/32 # printer.hogs.tswn.us
      # Samba listens on 445 in its own pod.  Component v2 moves it into
      # the paperless pod, on the port named smb.
      ports:
        - port: 445
          protocol: TCP
        - port: smb
          protocol: TCP
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - paperless
          - samba
  policyTypes:
    - Ingress
