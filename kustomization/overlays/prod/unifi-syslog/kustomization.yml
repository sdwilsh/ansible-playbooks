---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/networkpolicy-allow-from-man-vlan
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/networkpolicy-allow-to-loki
  - ../../../components/networkpolicy-deny-all
  - ../../../components/pod-security-enforce-restricted
configMapGenerator:
  - name: alloy-config
    files:
      - configmap/loki.alloy
      - configmap/syslog.alloy
helmCharts:
  - name: alloy
    version: 1.15.0
    repo: https://grafana.github.io/helm-charts
    releaseName: alloy
    valuesFile: alloy-values.yml
images:
  - name: docker.io/grafana/alloy
    newTag: v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
namespace: unifi-syslog
patches:
  - path: patches/add_loki_client_label.yml
    target:
      kind: Deployment
      name: alloy
  - path: patches/add_man_vlan_target_label.yml
    target:
      kind: Deployment
      name: alloy
  - path: patches/set_syslog_networkpolicy_ports.yml
    target:
      kind: NetworkPolicy
      name: allow-from-man-vlan-networkpolicy
resources:
  - namespace.yml
  - networkpolicy/allow-from-unifi-controller.yml
  - networkpolicy/allow-from-unifi-devices.yml
  - service.yml
