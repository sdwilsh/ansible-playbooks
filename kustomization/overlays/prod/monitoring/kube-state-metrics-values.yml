---
namespaceOverride: monitoring

collectors:
  - deployments
  - endpointslices
  - leases
  - nodes
  - pods
  - services
  - statefulsets

priorityClassName: application-infra

prometheus:
  monitor:
    enabled: true

resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi
