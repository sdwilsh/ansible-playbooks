---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../components/cnpg-backup
  - ../../../components/cnpg-podmonitor
  - ../../../components/networkpolicy-allow-from-api-server
  - ../../../components/networkpolicy-allow-from-cnpg-operator
  - ../../../components/networkpolicy-allow-from-traefik
  - ../../../components/networkpolicy-allow-to-api-server
  - ../../../components/networkpolicy-allow-to-coredns
  - ../../../components/networkpolicy-allow-to-garage
  - ../../../components/networkpolicy-allow-within-this-namespace
  - ../../../components/networkpolicy-deny-all
  - ../../../components/pod-security-enforce-restricted
  - ../../../components/prometheus
configMapGenerator:
  - name: alloy-config
    files:
      - configmap/kubernetes.alloy
      - configmap/loki.alloy
  - name: loki-rules-configmap
    files:
      - configmap/loki/blocky.yaml
      - configmap/loki/linux-mcp.yaml
      - configmap/loki/networkpolicy.yaml
    options:
      disableNameSuffixHash: true
      labels:
        loki_rule: "true"
helmCharts:
  - name: alloy
    version: 1.16.0
    repo: https://grafana.github.io/helm-charts
    releaseName: alloy
    valuesFile: alloy-values.yml
  - name: grafana
    version: 10.5.15
    repo: https://grafana.github.io/helm-charts
    releaseName: grafana
    valuesFile: grafana-values.yml
  - name: kube-state-metrics
    version: 9.0.0
    repo: https://prometheus-community.github.io/helm-charts
    releaseName: kube-state-metrics
    valuesFile: kube-state-metrics-values.yml
  - name: loki
    namespace: monitoring
    version: 7.5.0
    repo: https://grafana.github.io/helm-charts
    releaseName: loki
    valuesFile: loki-values.yml
  - name: prometheus-adapter
    version: 5.4.0
    repo: oci://ghcr.io/prometheus-community/charts
    releaseName: prometheus-adapter
    valuesFile: prometheus-adapter-values.yml
images:
  - name: docker.io/bitnami/kubectl
    newTag: latest@sha256:8919c149c2e3d6860e0143c117900e64d71395172aaef0e01e604bb98c8e7ce0
  - name: docker.io/grafana/alloy
    newTag: v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
  - name: postgres
    newTag: 18@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
  - name: registry.k8s.io/kube-state-metrics/kube-state-metrics
    newTag: v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
  - name: registry.k8s.io/prometheus-adapter/prometheus-adapter
    newTag: v0.12.0@sha256:932eae60e2bcf9c4660d6442da066ef1a79b4ea7cc232c61c7303069216ca006
namespace: monitoring
patches:
  - path: patches/alertmanager/set_configuration.yml
    target:
      kind: Alertmanager
      name: alertmanager
  - path: patches/alertmanager/set_externalUrl.yml
    target:
      kind: Alertmanager
      name: alertmanager
  - path: patches/cnpg/set_backup_path.yml
    target:
      kind: ObjectStore
      name: garage-objectstore
  - path: patches/loki/add_garage_client_label.yml
    target:
      kind: Deployment|StatefulSet
      labelSelector: app.kubernetes.io/name=loki,app.kubernetes.io/component
        notin (memcached-chunks-cache,memcached-results-cache)
  - path: patches/loki/add_traefik_route_label.yml
    target:
      kind: Deployment|StatefulSet
      labelSelector: app.kubernetes.io/name=loki,app.kubernetes.io/component in
        (compactor,distributor,query-frontend,ruler)
  - path: patches/loki/drop_secrets_from_role.yml
    target:
      kind: Role
      name: loki
  - path: patches/loki/set_service_type_load_balancer.yml
    target:
      kind: Service
      name: loki-distributor
  - path: patches/prometheus/set_externalUrl.yml
    target:
      kind: Prometheus
      name: prometheus
  - path: patches/prometheus-adapter/set_correct_apiVersion.yml
    target:
      kind: APIService
  - path: patches/add_traefik_networkpolicy_ports.yml
    target:
      kind: NetworkPolicy
      name: allow-from-traefik-networkpolicy
  - path: patches/add_traefik_route_label.yml
    target:
      kind: Deployment
      name: grafana
  - path: patches/set_api_server_networkpolicy_ports.yml
    target:
      kind: NetworkPolicy
      name: allow-from-api-server-networkpolicy
  - path: patches/alertmanager/add_traefik_route_label.yml
    target:
      kind: Alertmanager
      name: alertmanager
  - path: patches/prometheus/add_traefik_route_label.yml
    target:
      kind: Prometheus
      name: prometheus
resources:
  - namespace.yml
  - alertmanagerconfig.yml
  - cnpg/backup.yml
  - cnpg/cluster.yml
  - cnpg/scheduledbackup.yml
  - ingress.yml
  - middleware/loki-clients.yml
  - networkpolicy/allow-from-alertmanager-to-internet.yml
  - networkpolicy/allow-from-alloy-to-api-server.yml
  - networkpolicy/allow-from-grafana-to-internet.yml
  - networkpolicy/allow-from-kube-state-metrics-to-api-server.yml
  - networkpolicy/allow-from-loki-ruler-to-api-server.yml
  - networkpolicy/allow-from-prometheus-adapter-to-api-server.yml
  - networkpolicy/allow-from-prometheus.yml
  - networkpolicy/allow-to-grafana.yml
  - networkpolicy/allow-to-loki.yml
  - scrapeconfig/kubelet-cadvisor.yml
  - scrapeconfig/kubelet.yml
  - servicemonitor/loki.yml
