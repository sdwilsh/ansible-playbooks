---
# This rule admits the clients of the log store.  A client in the pod network
# also needs a path out of its own namespace, which the
# `networkpolicy-allow-to-loki` component gives it.
#
# The `alloy-node` DaemonSet of node-monitoring uses the network of the node,
# so a label cannot select it.  The addresses of the nodes below carry that
# traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-loki-networkpolicy
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              hogs.tswn.us/loki-client: "true"
          podSelector:
            matchLabels:
              hogs.tswn.us/loki-client: "true"
        - ipBlock:
            cidr: 10.11.2.0/24 # hogsflixplus (HFP) remote nodes
        - ipBlock:
            cidr: 10.11.0.101/32 # node01 (alloy-node hostNetwork DaemonSet)
        - ipBlock:
            cidr: 10.11.0.104/32 # worker01 (alloy-node hostNetwork DaemonSet)
        - ipBlock:
            cidr: 10.11.0.105/32 # worker02 (alloy-node hostNetwork DaemonSet)
        - ipBlock:
            cidr: 10.11.0.106/32 # worker03 (alloy-node hostNetwork DaemonSet)
        - ipBlock:
            cidr: 10.11.0.120/32 # gpuworker01 (alloy-node hostNetwork DaemonSet)
        - ipBlock:
            cidr: 10.11.0.121/32 # gpuworker02 (alloy-node hostNetwork DaemonSet)
      ports:
        - port: 3100
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Ingress
