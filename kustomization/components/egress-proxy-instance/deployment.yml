---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iron-proxy-deployment
spec:
  minReadySeconds: 5
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: iron-proxy
  strategy:
    rollingUpdate:
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iron-proxy
        hogs.tswn.us/internet-client: "true"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: iron-proxy
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      containers:
        - args:
            - -config
            - /etc/iron-proxy/config/proxy.yaml
          image: docker.io/ironsh/iron-proxy
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 15
          name: iron-proxy
          ports:
            - containerPort: 8080
              name: tunnel
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          # `/healthz` always gives 200, so readiness checks the listener of
          # the clients.
          readinessProbe:
            periodSeconds: 10
            tcpSocket:
              port: tunnel
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/iron-proxy/ca
              name: ca
              readOnly: true
            - mountPath: /etc/iron-proxy/config
              name: config
              readOnly: true
      enableServiceLinks: false
      priorityClassName: application-infra
      securityContext:
        fsGroup: 65532
      volumes:
        - name: ca
          secret:
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
            secretName: iron-proxy-ca-secret
        - configMap:
            name: iron-proxy-configmap
          name: config
