---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-redis-operator-networkpolicy
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redis
          podSelector:
            matchLabels:
              name: redis-operator
      ports:
        - port: 6379 # The Redis container does not name this port.
          protocol: TCP
        - port: sentinel
          protocol: TCP
  podSelector:
    matchExpressions:
      - key: redis_setup_type
        operator: Exists
  policyTypes:
    - Ingress
