---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-nodes-networkpolicy
spec:
  ingress:
    - from:
        - ipBlock:
            cidr: 10.11.0.101/32 # node01, on SERVICES
        - ipBlock:
            cidr: 10.11.0.104/32 # worker01, on SERVICES
        - ipBlock:
            cidr: 10.11.0.105/32 # worker02, on SERVICES
        - ipBlock:
            cidr: 10.11.0.106/32 # worker03, on SERVICES
        - ipBlock:
            cidr: 10.11.0.120/32 # gpuworker01, on SERVICES
        - ipBlock:
            cidr: 10.11.0.121/32 # gpuworker02, on SERVICES
  podSelector:
    matchLabels:
      hogs.tswn.us/nodes-target: "true"
  policyTypes:
    - Ingress
