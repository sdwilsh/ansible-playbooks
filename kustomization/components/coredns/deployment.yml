---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: coredns
  strategy:
    rollingUpdate:
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coredns
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - coredns
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - args:
            - -conf
            - /config/Corefile
          image: docker.io/coredns/coredns
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
            timeoutSeconds: 3
          name: coredns
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE # the coredns binary has this as a file capability; exec fails without it, regardless of port
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532 # nonroot, per the image's distroless base
            runAsNonRoot: true
            runAsUser: 65532 # nonroot, per the image's distroless base
            seccompProfile:
              type: RuntimeDefault
      priorityClassName: application-infra
