---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: proton-bridge-statefulset
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: proton-bridge
  serviceName: proton-bridge-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proton-bridge
    spec:
      automountServiceAccountToken: false
      containers:
        - image: ghcr.io/dancwilliams/protonmail-bridge-docker
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - pgrep -f proton-bridge || exit 1
            failureThreshold: 3
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          name: proton-bridge
          ports:
            - containerPort: 25
            - containerPort: 143
          resources:
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            # socat binds ports 25 and 143.
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /root
              name: data
      # The entrypoint runs as root and keeps its state in /root.  In a user
      # namespace that root is not root on the node.
      hostUsers: false
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        labels:
          # Use this PVC to configure attached PVs.
          recurring-job.longhorn.io/source: enabled
          # Opt into the no-backup group since it can easily be recreated.
          recurring-job-group.longhorn.io/no-backup: enabled
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
        storageClassName: longhorn-encrypted
