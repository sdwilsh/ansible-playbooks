# The buildah-action-runner image adds a drop-in that sets overlay storage
# through fuse-overlayfs.  The job pod has no /dev/fuse, so use the kernel
# overlay driver.  The kernel rejects the fuse-overlayfs option fsync=0.
[storage]
driver = "overlay"

[storage.options.overlay]
mount_program = ""
mountopt = "nodev"
