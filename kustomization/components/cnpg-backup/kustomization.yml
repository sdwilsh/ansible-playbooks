---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - files:
      - configmap/wait-for-backup.sh
    name: cnpg-backup-scripts-configmap
    options:
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: HookSucceeded
        argocd.argoproj.io/sync-wave: "0"
patches:
  - path: patches/add_api_server_client_label_to_check.yml
    target:
      kind: Pod
      labelSelector: app.kubernetes.io/component=wait-for-backup
  - path: patches/add_api_server_client_label_to_cluster.yml
    target:
      group: postgresql.cnpg.io
      kind: Cluster
resources:
  - networkpolicy/allow-cluster-to-garage.yml
  - objectstore.yml
  - rbac.yml
