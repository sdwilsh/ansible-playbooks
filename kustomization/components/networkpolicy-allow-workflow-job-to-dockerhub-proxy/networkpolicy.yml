---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-workflow-job-to-dockerhub-proxy-networkpolicy
spec:
  egress:
    - ports:
        - port: web
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dockerhub-proxy
          podSelector:
            matchLabels:
              app.kubernetes.io/name: proxy-registry
  podSelector:
    matchLabels:
      app.kubernetes.io/component: workflow-job
  policyTypes:
    - Egress
