---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-rules
  namespace: prometheus
spec:
  groups:
    - name: node
      rules:
        - alert: node-rebooted
          annotations:
            description: "{{ $labels.node }} rebooted (boot time changed) within the last 15 minutes."
          expr: changes((max by (node) (node_boot_time_seconds))[15m:1m]) > 0
          labels:
            severity: page
        - alert: node-not-ready
          annotations:
            description: "{{ $labels.node }} has been unready for more than 5 minutes."
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: page
        - alert: node-unreachable
          annotations:
            description: "{{ $labels.node }} is unreachable and its workloads may be stuck instead of rescheduled."
          expr: kube_node_spec_taint{key="node.kubernetes.io/unreachable",effect="NoSchedule"} == 1
          for: 2m
          labels:
            severity: page
        - alert: kube-state-metrics-down
          annotations:
            description: "kube-state-metrics has not been scraped for 5 minutes; node-not-ready and node-unreachable cannot fire while this is down."
          expr: up{job="kube-state-metrics"} == 0
          for: 5m
          labels:
            severity: page
        - alert: node-exporter-down
          annotations:
            description: "node-exporter on {{ $labels.instance }} has not been scraped for 5 minutes; the node may be wedged or unreachable."
          expr: up{job="prometheus-node-exporter"} == 0
          for: 5m
          labels:
            severity: page
        - alert: node-memory-available-low
          annotations:
            description: "{{ $labels.node }} has less than 5% of its memory available; the kernel is close to the OOM killer."
          expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.05
          for: 10m
          labels:
            severity: page
        # The GPU takes system memory through GTT.  The kubelet reads
        # `memory.available` from the root cgroup, which does not include GTT
        # pages, so `eviction-hard` cannot protect a GPU node.  node-exporter
        # reads `/proc/meminfo`, which does include GTT pages, so the metric
        # below is the only signal that sees the memory of the GPU.  See
        # `group_vars/kairos_gpuworker.yml`.
        - alert: gpu-node-memory-available-low
          annotations:
            description: "{{ $labels.node }} has less than 12 GiB of memory available. The GPU can hold 115 GiB in GTT, the kernel cannot reclaim GTT pages, and `oom_score` does not count them, so the OOM killer stops an unrelated process."
          expr: node_memory_MemAvailable_bytes{node=~"gpuworker[0-9]+"} < 12 * 1024 ^ 3
          for: 15m
          labels:
            severity: warning
