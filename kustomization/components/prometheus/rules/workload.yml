---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: workload-rules
spec:
  groups:
    - name: workload
      interval: 1m
      rules:
        - alert: pod-crash-looping
          annotations:
            description: "The pod {{ $labels.exported_namespace }}/{{ $labels.exported_pod }} is in CrashLoopBackOff for more than 10 minutes."
          expr: max by (exported_namespace,exported_pod) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}) == 1
          for: 10m
          labels:
            severity: warning
        - alert: node-near-pod-limit
          annotations:
            description: "The node {{ $labels.node }} runs {{ $value | humanizePercentage }} of its pod limit for more than 15 minutes.  New pods can fail to schedule."
          expr: max by (node) (label_replace(kubelet_running_pods,"node","$1","instance","(.*)")) / max by (node) (kube_node_status_allocatable{resource="pods"}) > 0.85
          for: 15m
          labels:
            severity: warning
