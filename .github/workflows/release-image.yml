---
name: Release Image
on:
  workflow_call:
    inputs:
      arches:
        default: '["amd64"]'
        description: A JSON list of architectures.  Each architecture builds on a native runner.
        required: false
        type: string
      components-script:
        default: ""
        description: A script that runs in the image and prints more component rows for the release notes.
        required: false
        type: string
      context:
        description: The build context.  This directory contains the Containerfile.
        required: true
        type: string
      description:
        description: The value of the org.opencontainers.image.description label.
        required: true
        type: string
      highlight-packages:
        default: kernel systemd
        description: The packages to show in the component table of the release notes.
        required: false
        type: string
      image:
        description: The image name.  It is also the Containerfile stage, the release tag prefix and the release notes component.
        required: true
        type: string
      release:
        description: True when this run publishes a release.  A false value builds the image and publishes nothing.
        required: true
        type: boolean
      verify-script:
        default: ""
        description: A script that copies the signed image with the signature check that hosts run.  It takes a source and a destination.
        required: false
        type: string
    secrets:
      signing-key:
        description: The private key that signs the image.
        required: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}

jobs:
  version:
    name: Reserve release version

    if: ${{ inputs.release }}

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    permissions:
      contents: write

    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts

      - name: Create version tag
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ inputs.image }}
        id: version
        run: |
          prefix=$(date -u +%Y.%-m)
          version=$(
            gh api --paginate "repos/${GH_REPO}/git/matching-refs/tags/${IMAGE_NAME}-${prefix}." --jq '.[].ref' |
              sed 's|^refs/tags/||' |
              .github/scripts/next-calver-version.sh "${IMAGE_NAME}" "${prefix}"
          )
          gh api "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${IMAGE_NAME}-${version}" -f sha="${GITHUB_SHA}"
          echo "tag=${IMAGE_NAME}-${version}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ inputs.image }} for ${{ matrix.arch }}

    needs: version

    if: ${{ !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped') }}

    # Only the amd64 leg sets this.  An empty output from another leg does
    # not replace it.
    outputs:
      previous-tag: ${{ steps.release_notes.outputs.previous-tag }}

    permissions:
      contents: read
      packages: write

    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-26.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Get current date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: metadata
        with:
          labels: |
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ inputs.description }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/blob/${{ github.sha }}/${{ inputs.context }}/Containerfile
            org.opencontainers.image.title=${{ inputs.image }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ needs.version.outputs.version || github.sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: ${{ inputs.release }}
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      # Buildx cannot push a tagged image by digest, so the loaded image has
      # its own name.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          build-args: |
            MACK_VERSION=${{ needs.version.outputs.version || github.sha }}
          cache-from: type=gha,scope=${{ inputs.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ inputs.image }}-${{ matrix.arch }},mode=max
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/Containerfile
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: |
            type=docker,name=${{ inputs.image }}:ci
            ${{ inputs.release && format('type=image,name={0},name-canonical=true,push=true,push-by-digest=true', env.IMAGE) || '' }}
          platforms: linux/${{ matrix.arch }}
          pull: true
          target: ${{ inputs.image }}

      - name: Generate Image Release Notes
        uses: marinatedconcrete/config/actions/image-release-notes@392d574759d1fdb31b44508c630cea78a25c7867 # image-release-notes-1.0.0
        id: release_notes
        if: ${{ matrix.arch == 'amd64' }}
        with:
          component: ${{ inputs.image }}
          components-script: ${{ inputs.components-script }}
          highlight-packages: ${{ inputs.highlight-packages }}
          image: ${{ inputs.image }}:ci
          tag: ${{ needs.version.outputs.tag }}
          version: ${{ needs.version.outputs.version || github.sha }}

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.release && matrix.arch == 'amd64' }}
        with:
          if-no-files-found: error
          name: ${{ inputs.image }}-release-notes
          path: |
            ${{ steps.release_notes.outputs.notes-path }}
            ${{ steps.release_notes.outputs.sbom-path }}

      - name: Record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        if: ${{ inputs.release }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.release }}
        with:
          if-no-files-found: error
          name: ${{ inputs.image }}-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}

  release:
    name: Release ${{ inputs.image }} ${{ needs.version.outputs.version }}

    needs:
      - build
      - version

    if: ${{ inputs.release }}

    permissions:
      contents: write
      id-token: write
      packages: write

    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: ${{ runner.temp }}/digests
          pattern: ${{ inputs.image }}-digest-*

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - name: Create version index
        env:
          VERSION: ${{ needs.version.outputs.version }}
        id: index
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/digests"
          sources=()
          built_manifests=()
          for file in *; do
            sources+=("${IMAGE}@sha256:${file}")
            index_children=$(docker buildx imagetools inspect --raw "${IMAGE}@sha256:${file}" | jq -r '.manifests[]?.digest')
            built_manifests+=("${index_children:-sha256:${file}}")
          done
          if existing=$(docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" 2> /dev/null); then
            if [[ "$(jq -r '.manifests[].digest' <<< "${existing}" | sort)" != "$(printf '%s\n' "${built_manifests[@]}" | sort)" ]]; then
              echo "${IMAGE}:${VERSION} holds other manifests than this run built." >&2
              exit 1
            fi
          else
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.version=${VERSION}" \
              --tag "${IMAGE}:${VERSION}" \
              "${sources[@]}"
          fi
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign container image
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.signing-key }}
          DIGEST: ${{ steps.index.outputs.digest }}
        # Hosts read only the legacy .sig signature, so sign in both formats.
        run: |
          cosign sign -y --recursive --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"
          cosign sign -y --recursive --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"

      # cosign deprecates the legacy flags.  If hosts cannot verify the
      # signature, this step fails the release before latest moves.
      - name: Verify the signature as hosts do
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
          VERIFY_SCRIPT: ${{ inputs.verify-script }}
        if: ${{ inputs.verify-script != '' }}
        run: |
          "${VERIFY_SCRIPT}" "docker://${IMAGE}@${DIGEST}" "dir:$(mktemp -d)"

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.image }}-release-notes
          path: build/release

      - name: Create release
        env:
          CONTEXT: ${{ inputs.context }}
          DIGEST: ${{ steps.index.outputs.digest }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ inputs.image }}
          PREVIOUS_TAG: ${{ needs.build.outputs.previous-tag }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            exit 0
          fi
          caller="${GITHUB_WORKFLOW_REF#*/*/}"
          caller="${caller%@*}"
          if [[ -n "${PREVIOUS_TAG}" ]]; then
            body=$(git log --format='- %s (%h)' "${PREVIOUS_TAG}..${TAG}" -- "${CONTEXT}" "${caller}" .github/workflows/release-image.yml)
            body=${body:-No changes to the image build files.}
          else
            body="First versioned release."
          fi
          body+=$'\n\n'"Image: \`${IMAGE}:${VERSION}@${DIGEST}\`"
          gh release create "${TAG}" --title "${IMAGE_NAME} ${VERSION}" --verify-tag --notes "${body}"

      - name: Publish Image Release Notes
        uses: marinatedconcrete/config/actions/image-release-notes/publish@392d574759d1fdb31b44508c630cea78a25c7867 # image-release-notes-1.0.0
        with:
          component: ${{ inputs.image }}
          tag: ${{ needs.version.outputs.tag }}

      - name: Move latest to this release
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${DIGEST}"
          latest=$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ "${latest}" != "${DIGEST}" ]]; then
            echo "${IMAGE}:latest is ${latest}, not the signed ${DIGEST}." >&2
            exit 1
          fi
