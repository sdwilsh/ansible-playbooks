---
name: Build Mack Kairos Container Image
on:
  pull_request:
    branches:
      - main
      - renovate/**
    paths: &paths
      - .github/scripts/next-calver-version.sh
      - .github/workflows/build-mack-kairos.yml
      - .github/workflows/release-image.yml
      - images/mack/Containerfile
      - images/mack/build_files/**
      - images/mack/release-notes-components.sh
  push:
    branches:
      - main
      - renovate/**
    paths: *paths
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  plan:
    name: Decide if this run releases

    outputs:
      release: ${{ steps.plan.outputs.release }}

    runs-on: ubuntu-26.04

    steps:
      - name: Check the event and the branch
        env:
          RELEASE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        id: plan
        run: echo "release=${RELEASE}" >> "${GITHUB_OUTPUT}"

  mack-kairos:
    name: Build and release mack-kairos

    needs: plan

    # A release run must not cancel another release run after it creates its tag.
    concurrency:
      cancel-in-progress: ${{ !fromJSON(needs.plan.outputs.release) }}
      group: ${{ fromJSON(needs.plan.outputs.release) && 'release-mack-kairos' || format('{0}-{1}', github.workflow, github.ref) }}

    permissions:
      contents: write
      id-token: write
      packages: write

    secrets:
      signing-key: ${{ secrets.SIGNING_SECRET }}

    uses: ./.github/workflows/release-image.yml

    with:
      components-script: images/mack/release-notes-components.sh
      context: images/mack
      description: Mack's build files, on top of kairos-fedora instead of fedora-bootc, for k3s cluster nodes.
      image: mack-kairos
      release: ${{ fromJSON(needs.plan.outputs.release) }}
