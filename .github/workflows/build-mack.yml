---
name: Build Mack OS Container Image
on:
  pull_request:
    branches:
      - main
      - renovate/**
  push:
    branches:
      - main
      - renovate/**
    paths:
      - .github/workflows/build-mack.yml
      - images/mack/Containerfile
      - images/mack/build_files/**
      - justfile
  workflow_dispatch:

env:
  IMAGE_DESC: Mack OS—A bootc-powered core operating system.
  IMAGE_KEYWORDS: bootc
  IMAGE_LOGO_URL: https://avatars.githubusercontent.com/u/656602?s=200&v=4
  IMAGE_NAME: mack
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  compute_date:
    name: Compute build date

    runs-on: ubuntu-24.04

    outputs:
      date: ${{ steps.date.outputs.date }}

    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "${GITHUB_OUTPUT}"

  build_push_image:
    name: Build and push image

    needs:
      - compute_date

    permissions:
      contents: read
      packages: write
      id-token: write

    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm

    steps:
      - name: Setup Platform-Specific Tag
        run: |
          if [[ "${{ matrix.runner }}" == *"arm" ]]; then
            echo "DEFAULT_TAG=latest-arm64" >> ${GITHUB_ENV}
            echo "PLATFORM=linux/arm64" >> ${GITHUB_ENV}
          else
            echo "DEFAULT_TAG=latest-amd64" >> ${GITHUB_ENV}
            echo "PLATFORM=linux/amd64" >> ${GITHUB_ENV}
          fi

      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mount BTRFS for podman storage
        uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # main

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT
      
      - name: Compute SOURCE_DATE_EPOCH
        id: epoch
        run: echo "epoch=$(date -d '${{ github.event.head_commit.timestamp }}' +%s)" >> $GITHUB_OUTPUT

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: metadata
        with:
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.${{ needs.compute_date.outputs.date }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: &image-labels |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/refs/heads/main/images/mack/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/refs/heads/main/images/mack/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/main/images/mack/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.${{ needs.compute_date.outputs.date }}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: |
          sudo -E $(command -v just) build-mack \
            ${PLATFORM} \
            ${DEFAULT_TAG}

      # - name: Rechunk with Chunkah
      #   env:
      #     SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
      #   run: |
      #     sudo -E $(command -v just) rechunk \
      #       ${{ env.IMAGE_NAME}} \
      #       ${DEFAULT_TAG}

      - name: Tag Image
        id: tag-images
        run: |
          sudo -E $(command -v just) tag-images \
            "${{ env.IMAGE_NAME }}" \
            "${DEFAULT_TAG}" \
            "${{ steps.metadata.outputs.tags }}" \
            "${{ env.IMAGE_REGISTRY }}"

      - &ghcr_login
        name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        run: |
          podman images
          sudo -E podman images
          for tag in ${{ steps.metadata.outputs.tags }}; do
              sudo -E podman push "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}"
          done

      - &install_cosign
        name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY $IMAGE_FULL:$tag
          done
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

  build_push_manifest:
    env:
      DEFAULT_TAG: latest

    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    name: Build and push manifest
    needs:
      - compute_date
      - build_push_image

    permissions:
      contents: read
      packages: write
      id-token: write

    runs-on: ubuntu-24.04

    steps:
      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: metadata
        with:
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.${{ needs.compute_date.outputs.date }}
            type=raw,value=${{ needs.compute_date.outputs.date }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: *image-labels
          sep-tags: " "
          sep-annotations: " "

      - *ghcr_login

      - name: Create Manifest
        run: |
          SOURCE_IMAGE="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          DATE="${{ needs.compute_date.outputs.date }}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            podman manifest create "${{ env.IMAGE_NAME }}:$tag"
            podman manifest add "${{ env.IMAGE_NAME }}:$tag" docker://$SOURCE_IMAGE:latest-amd64.$DATE
            podman manifest add "${{ env.IMAGE_NAME }}:$tag" docker://$SOURCE_IMAGE:latest-arm64.$DATE
          done

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

  build_push_mack_kairos:
    name: Build and push mack-kairos image

    env:
      IMAGE_DESC: Mack's build files, on top of kairos-fedora instead of fedora-bootc, for k3s cluster nodes.
      IMAGE_NAME: mack-kairos

    permissions:
      contents: read
      packages: write
      id-token: write

    runs-on: ubuntu-24.04

    steps:
      - *checkout

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Get current date
        id: date
        run: echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> "${GITHUB_OUTPUT}"

      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: metadata
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=latest.{{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/blob/main/images/mack/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build image for testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/mack
          file: images/mack/Containerfile
          target: mack-kairos
          build-args: |
            GIT_SHA=${{ github.sha }}
          load: true
          platforms: linux/amd64
          push: false
          tags: mack-kairos:ci
          cache-from: type=gha,scope=mack-kairos
          cache-to: type=gha,scope=mack-kairos,mode=max

      - *ghcr_login

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        with:
          context: images/mack
          file: images/mack/Containerfile
          target: mack-kairos
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha,scope=mack-kairos
          cache-to: type=gha,scope=mack-kairos,mode=max

      - *install_cosign

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          cosign sign -y --recursive --key env://COSIGN_PRIVATE_KEY "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
