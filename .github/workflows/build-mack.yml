---
name: Build Mack Container Images
on:
  pull_request:
    branches:
      - main
      - renovate/**
    paths: &paths
      - .github/scripts/next-calver-version.sh
      - .github/workflows/build-mack.yml
      - .github/workflows/release-image.yml
      - images/mack/**
  push:
    branches:
      - main
      - renovate/**
    paths: *paths
  schedule:
    # Each Monday at 12:00 UTC.  This is 04:00 Pacific in winter and 05:00
    # Pacific in summer.
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      image:
        default: all
        description: The image to build and release.
        options:
          - all
          - mack
          - mack-kairos
        required: true
        type: choice

jobs:
  plan:
    name: Decide if this run releases

    outputs:
      release: ${{ steps.plan.outputs.release }}

    runs-on: ubuntu-26.04

    steps:
      - name: Check the event and the branch
        env:
          RELEASE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        id: plan
        run: echo "release=${RELEASE}" >> "${GITHUB_OUTPUT}"

  mack:
    name: Build and release mack

    needs: plan

    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == 'mack' }}

    concurrency:
      cancel-in-progress: ${{ !fromJSON(needs.plan.outputs.release) }}
      group: ${{ fromJSON(needs.plan.outputs.release) && 'release-mack' || format('{0}-mack-{1}', github.workflow, github.ref) }}

    permissions:
      contents: write
      id-token: write
      packages: write

    secrets:
      signing-key: ${{ secrets.SIGNING_SECRET }}

    uses: ./.github/workflows/release-image.yml

    with:
      arches: '["amd64", "arm64"]'
      components-script: images/mack/release-notes-components.sh
      context: images/mack
      description: Mack OS, a bootc-powered core operating system.
      highlight-packages: bootc kernel systemd
      image: mack
      release: ${{ fromJSON(needs.plan.outputs.release) }}

  mack-kairos:
    name: Build and release mack-kairos

    needs: plan

    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == 'mack-kairos' }}

    concurrency:
      cancel-in-progress: ${{ !fromJSON(needs.plan.outputs.release) }}
      group: ${{ fromJSON(needs.plan.outputs.release) && 'release-mack-kairos' || format('{0}-mack-kairos-{1}', github.workflow, github.ref) }}

    permissions:
      contents: write
      id-token: write
      packages: write

    secrets:
      signing-key: ${{ secrets.SIGNING_SECRET }}

    uses: ./.github/workflows/release-image.yml

    with:
      components-script: images/mack/release-notes-components.sh
      context: images/mack
      description: Mack's build files, on top of kairos-fedora instead of fedora-bootc, for k3s cluster nodes.
      image: mack-kairos
      release: ${{ fromJSON(needs.plan.outputs.release) }}
