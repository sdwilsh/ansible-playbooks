---
name: Devcontainer-based CI
on:
 push:
   branches:
     - main
     - renovate/**
 pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4 
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Buildx to use docker-container
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Pre-build image and run lint in dev container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          cacheFrom: ghcr.io/${{ github.repository }}-devcontainer
          cacheTo: ghcr.io/${{ github.repository }}-devcontainer
          env: |
            CI=1
          imageName: ghcr.io/${{ github.repository }}-devcontainer
          push: filter
          refFilterForPush: refs/heads/main

  quick-lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run quick-lint
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          cacheFrom: ghcr.io/${{ github.repository }}-devcontainer
          env: |
            ANSIBLE_CONFIG=ansible-ci.cfg
            CI=1
          push: never
          runCmd: |
            set -euxo pipefail
            just ansible-lint
            just ansible-syntax-check
            just ansible-scale-order-check
            just coredns-drift-check
            just go-test
            just go-traefik-test
            just go-vet
            just gofmtcheck
            just hadolint
            just justcheck
            just next-calver-version-test
            just renovate-validate
            just shellcheck
            just traefik-pin-check

  kustomize-build:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run kustomize-build
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          cacheFrom: ghcr.io/${{ github.repository }}-devcontainer
          env: |
            CI=1
          push: never
          runCmd: |
            set -euxo pipefail
            just kustomize-build
            just image-pin-check
