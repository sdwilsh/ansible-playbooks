---
name: Devcontainer-based CI
on:
  pull_request:
  push:
    branches:
      - main
      - renovate/**

# A renovate branch push and its pull request share one head commit.  Do not
# put them in one group: the cancelled run stays on the commit as a failure.
# A new run cancels an old run of the same event and ref, but not on main.
concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  ansible:
    name: Lint the ansible code

    if: ${{ needs.changes.outputs.ansible == 'true' }}

    needs:
      - changes
      - devcontainer

    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/devcontainer
        with:
          run: |
            just ansible-lint
            just ansible-syntax-check
            just ansible-scale-order-check

  changes:
    name: Select the jobs

    outputs:
      ansible: ${{ steps.select.outputs.ansible }}
      devcontainer: ${{ steps.select.outputs.devcontainer }}
      go: ${{ steps.select.outputs.go }}
      kustomize-build: ${{ steps.select.outputs.kustomize-build }}
      mack: ${{ steps.select.outputs.mack }}
      nut-shutdown-agent: ${{ steps.select.outputs.nut-shutdown-agent }}
      renovate-validate: ${{ steps.select.outputs.renovate-validate }}
      shell-docker-lint: ${{ steps.select.outputs.shell-docker-lint }}
      sif: ${{ steps.select.outputs.sif }}
      wireguard-egress: ${{ steps.select.outputs.wireguard-egress }}

    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # This is the `select-jobs-test` recipe.  It needs no image.
      - name: Test the job selection
        run: .github/scripts/test-select-jobs.py

      # A pull request compares with its base.  A renovate branch compares with
      # main.  Any other run, such as a push to main, selects every job.
      - name: Select the jobs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        id: select
        run: |
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
            pull_request:*) args=(--base "${BASE_SHA}") ;;
            push:refs/heads/renovate/*) args=(--base origin/main) ;;
            *) args=(--all) ;;
          esac
          .github/scripts/select-jobs.py "${args[@]}" | tee --append "${GITHUB_OUTPUT}"

  ci-result:
    name: CI result

    # This job is the one required check.  A skipped job passes.
    if: ${{ always() }}

    needs:
      - ansible
      - changes
      - devcontainer
      - go
      - kustomize-build
      - mack
      - nut-shutdown-agent
      - renovate-validate
      - shell-docker-lint
      - sif
      - wireguard-egress

    runs-on: ubuntu-26.04

    steps:
      - name: Fail when a job failed or stopped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac

  devcontainer:
    name: Build the devcontainer image

    if: ${{ needs.changes.outputs.devcontainer == 'true' }}

    needs: changes

    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" |
            buildah login --username "${{ github.repository_owner }}" --password-stdin ghcr.io

      # Only a push to main writes the layer cache.  Other runs read it.
      - name: Build the devcontainer image with buildah
        env:
          CACHE: ghcr.io/${{ github.repository }}-devcontainer-cache
        run: |
          set -euxo pipefail
          cache_to=()
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ "${GITHUB_REF}" = refs/heads/main ]; then
            cache_to=(--cache-to "${CACHE}")
          fi
          buildah build \
            --cache-from "${CACHE}" \
            "${cache_to[@]}" \
            --file .devcontainer/Containerfile \
            --isolation=chroot \
            --layers \
            --tag devcontainer:ci \
            .

      - name: Save the devcontainer image
        run: buildah push devcontainer:ci "docker-archive:${RUNNER_TEMP}/devcontainer.tar:devcontainer:ci"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          compression-level: 1
          name: devcontainer
          path: ${{ runner.temp }}/devcontainer.tar
          retention-days: 1

  go:
    name: Check the Go code

    if: ${{ needs.changes.outputs.go == 'true' }}

    needs:
      - changes
      - devcontainer

    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/devcontainer
        with:
          run: |
            just go-test
            just go-traefik-test
            just go-vet
            just gofmtcheck

  kustomize-build:
    name: Build the kustomizations

    if: ${{ needs.changes.outputs.kustomize-build == 'true' }}

    needs:
      - changes
      - devcontainer

    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/devcontainer
        with:
          run: |
            just kustomize-build
            just image-pin-check
            just named-port-check
            just coredns-drift-check
            just tdarr-flows-test
            just traefik-pin-check

  mack:
    name: Build mack images

    # A push to main runs build-mack.yml by its own trigger.
    if: ${{ github.ref != 'refs/heads/main' && needs.changes.outputs.mack == 'true' }}

    needs: changes

    permissions:
      contents: write
      id-token: write
      packages: write

    secrets: inherit

    uses: ./.github/workflows/build-mack.yml

  nut-shutdown-agent:
    name: Build the nut-shutdown-agent image

    if: ${{ github.ref != 'refs/heads/main' && needs.changes.outputs.nut-shutdown-agent == 'true' }}

    needs: changes

    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/build-nut-shutdown-agent.yml

  # This job publishes the image that VS Code uses as its BuildKit cache.  It
  # is not part of the result.
  publish-devcontainer:
    name: Publish the devcontainer image

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.repository_owner }}

      - name: Set up Buildx to use docker-container
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Build and push the devcontainer image
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          cacheFrom: ghcr.io/${{ github.repository }}-devcontainer
          cacheTo: ghcr.io/${{ github.repository }}-devcontainer
          env: |
            CI=1
          imageName: ghcr.io/${{ github.repository }}-devcontainer
          push: always

  renovate-validate:
    name: Validate the renovate config

    if: ${{ needs.changes.outputs.renovate-validate == 'true' }}

    needs:
      - changes
      - devcontainer

    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/devcontainer
        with:
          run: just renovate-validate

  shell-docker-lint:
    name: Lint the shell, Docker and just files

    if: ${{ needs.changes.outputs.shell-docker-lint == 'true' }}

    needs:
      - changes
      - devcontainer

    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/devcontainer
        with:
          run: |
            just hadolint
            just justcheck
            just next-calver-version-test
            just shellcheck

  sif:
    name: Build the sif image

    if: ${{ github.ref != 'refs/heads/main' && needs.changes.outputs.sif == 'true' }}

    needs: changes

    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/build-sif.yml

  wireguard-egress:
    name: Build the wireguard-egress image

    if: ${{ github.ref != 'refs/heads/main' && needs.changes.outputs.wireguard-egress == 'true' }}

    needs: changes

    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/build-wireguard-egress.yml
